["COMP6992","THESIS","","","","N/A","Not Applicable",1,1,13],
["COMP6993","THESIS","","","","N/A","Not Applicable",1,1,13]
];

const DATA = RAW_DATA.map((r, idx) => ({
  id: idx, code: r[0], title: r[1], day: r[2], start: r[3], end: r[4],
  venue: r[5], staff: r[6], every: r[7], startWeek: r[8], endWeek: r[9]
}));

const DAY_LABELS = { Mon:'一', Tue:'二', Wed:'三', Thu:'四', Fri:'五', Sat:'六' };
const DAY_ORDER = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, '': 7 };
const CODE_REGEX = /^COMP\d+$/i;

const COLUMNS = [
  { key: 'code', label: 'Subject Code', align: 'text-left', minW: 'w-36' },
  { key: 'title', label: 'Subject Title', align: 'text-left', minW: 'min-w-[220px]' },
  { key: 'day', label: 'Day', align: 'text-left', minW: 'w-28' },
  { key: 'time', label: 'Time', align: 'text-left', minW: 'w-32' },
  { key: 'venue', label: 'Venue', align: 'text-left', minW: 'w-32' },
  { key: 'staff', label: 'Teaching Staff', align: 'text-left', minW: 'min-w-[180px]' },
  { key: 'every', label: 'Every (Wk)', align: 'text-center', minW: 'w-24' },
  { key: 'weeks', label: 'Weeks', align: 'text-center', minW: 'w-28' }
];

/* ================= State ================= */
const state = {
  search: '',
  day: '',
  venue: '',
  staff: '',
  view: 'table', // 'table' | 'card'
  sortCol: 'code',
  sortDir: 'asc', // 'asc' | 'desc'
  page: 1,
  pageSize: 20
};

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function codeLink(code) {
  if (CODE_REGEX.test(code)) {
    const url = 'https://www.polyu.edu.hk/comp/docdrive/tpg/subject/' + encodeURIComponent(code) + '.pdf';
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" title="開啟 ' + escapeHtml(code) + ' Subject Description Form (PDF)"'
      + ' class="inline-flex items-center gap-1 font-semibold text-lavender-700 hover:text-lavender-900 bg-lavender-100 hover:bg-lavender-200 px-2 py-0.5 rounded-md transition whitespace-nowrap text-xs sm:text-sm">'
      + escapeHtml(code)
      + '<svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg></a>';
  }
  return escapeHtml(code);
}

function highlight(text, query) {
  const safe = escapeHtml(text);
  if (!query) return safe;
  const q = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + q + ')', 'gi'), '<mark class="bg-lavender-200 text-lavender-900 rounded px-0.5">$1</mark>');
}

function parseTimeToMinutes(t) {
  if (!t) return 9999;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function showToast(msg) {
  const container = $('toast-container');
  const toast = document.createElement('div');
  toast.className = 'bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/* ================= Filtering & Sorting ================= */
function getFilteredAndSorted() {
  const q = state.search.trim().toLowerCase();

  // 1. Filter
  let list = DATA.filter(r => {
    if (state.day === '__TBA__' && r.day !== '') return false;
    if (state.day && state.day !== '__TBA__' && r.day !== state.day) return false;
    if (state.venue === '__N/A__' && r.venue !== 'N/A' && r.venue !== '') return false;
    if (state.venue && state.venue !== '__N/A__' && (!r.venue || !r.venue.toLowerCase().includes(state.venue.toLowerCase()))) return false;
    if (state.staff && !r.staff.toLowerCase().includes(state.staff.toLowerCase())) return false;
    if (q) {
      const hay = [r.code, r.title, r.day, r.start, r.end, r.venue, r.staff].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // 2. Sort
  const dirMultiplier = state.sortDir === 'asc' ? 1 : -1;
  const col = state.sortCol;

  list.sort((a, b) => {
    let res = 0;
    if (col === 'code') {
      res = a.code.localeCompare(b.code);
    } else if (col === 'title') {
      res = a.title.localeCompare(b.title);
    } else if (col === 'day') {
      const dayA = DAY_ORDER[a.day] || 99;
      const dayB = DAY_ORDER[b.day] || 99;
      res = dayA - dayB;
      if (res === 0) res = parseTimeToMinutes(a.start) - parseTimeToMinutes(b.start);
    } else if (col === 'time') {
      res = parseTimeToMinutes(a.start) - parseTimeToMinutes(b.start);
    } else if (col === 'venue') {
      res = (a.venue || '').localeCompare(b.venue || '');
    } else if (col === 'staff') {
      res = (a.staff || '').localeCompare(b.staff || '');
    } else if (col === 'every') {
      res = a.every - b.every;
    } else if (col === 'weeks') {
      res = a.startWeek - b.startWeek || a.endWeek - b.endWeek;
    }

    if (res === 0) {
      res = a.code.localeCompare(b.code);
    }
    return res * dirMultiplier;
  });

  return list;
}

/* ================= Rendering ================= */
function renderTableHeader() {
  const headerTr = $('table-header');
  headerTr.innerHTML = COLUMNS.map(c => {
    const isSorted = state.sortCol === c.key;
    const icon = isSorted
      ? (state.sortDir === 'asc'
          ? '<svg class="w-3.5 h-3.5 text-white inline ml-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg>'
          : '<svg class="w-3.5 h-3.5 text-white inline ml-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>')
      : '<svg class="w-3.5 h-3.5 opacity-40 group-hover:opacity-80 inline ml-1 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"/></svg>';

    return '<th data-sort="' + c.key + '" class="group cursor-pointer px-4 py-3.5 ' + c.align + ' font-semibold ' + c.minW + ' hover:bg-lavender-700/80 transition whitespace-nowrap">'
      + '<span class="inline-flex items-center gap-0.5">' + c.label + icon + '</span>'
      + '</th>';
  }).join('');
}

function renderTableRows(rows, startIdx) {
  const tbody = $('table-body');
  tbody.innerHTML = rows.map((r, i) => {
    const dayCell = r.day
      ? '<span class="inline-flex items-center gap-1.5 font-medium text-slate-700"><span class="w-1.5 h-1.5 rounded-full bg-lavender-400"></span>' + escapeHtml(r.day) + ' <span class="text-slate-400 text-xs">(' + DAY_LABELS[r.day] + ')</span></span>'
      : '<span class="text-slate-400 italic text-xs">TBA</span>';
    const timeCell = (r.start && r.end)
      ? '<span class="font-mono text-xs bg-lavender-50 text-lavender-800 px-2 py-1 rounded-md whitespace-nowrap border border-lavender-100">' + escapeHtml(r.start) + ' – ' + escapeHtml(r.end) + '</span>'
      : '<span class="text-slate-400 italic text-xs">—</span>';
    const venueCell = r.venue && r.venue !== 'N/A'
      ? highlight(r.venue, state.venue !== '__N/A__' ? (state.venue || state.search.trim()) : state.search.trim())
      : '<span class="text-slate-400 italic text-xs">N/A</span>';
    const staffCell = r.staff && r.staff !== 'Not Applicable'
      ? highlight(r.staff, state.staff || state.search.trim())
      : '<span class="text-slate-400 italic text-xs">Not Applicable</span>';
    const weeks = r.startWeek === r.endWeek ? 'W' + r.startWeek : 'W' + r.startWeek + ' – W' + r.endWeek;
    const zebra = (startIdx + i) % 2 === 1 ? 'bg-lavender-50/40' : '';

    return '<tr class="row-hover hover:bg-lavender-100/60 fade-in ' + zebra + '">'
      + '<td class="px-4 py-3">' + codeLink(r.code) + '</td>'
      + '<td class="px-4 py-3 font-medium text-slate-800">' + highlight(r.title, state.search.trim()) + '</td>'
      + '<td class="px-4 py-3 whitespace-nowrap">' + dayCell + '</td>'
      + '<td class="px-4 py-3 whitespace-nowrap">' + timeCell + '</td>'
      + '<td class="px-4 py-3 text-slate-600">' + venueCell + '</td>'
      + '<td class="px-4 py-3 text-slate-600">' + staffCell + '</td>'
      + '<td class="px-4 py-3 text-center text-slate-600">' + r.every + '</td>'
      + '<td class="px-4 py-3 text-center"><span class="text-xs font-semibold text-lavender-700 bg-lavender-100 px-2 py-0.5 rounded-full whitespace-nowrap">' + weeks + '</span></td>'
      + '</tr>';
  }).join('');
}

function renderCards(rows) {
  const cardGrid = $('card-grid');
  cardGrid.innerHTML = rows.map(r => {
    const dayLabel = r.day ? r.day + ' (' + DAY_LABELS[r.day] + ')' : '未定 TBA';
    const timeText = (r.start && r.end) ? r.start + ' – ' + r.end : '—';
    const weeksText = r.startWeek === r.endWeek ? 'W' + r.startWeek : 'W' + r.startWeek + ' – W' + r.endWeek;

    return '<div class="bg-white rounded-2xl p-5 border border-lavender-100 shadow-soft hover:shadow-card transition-all flex flex-col justify-between gap-4 fade-in">'
      + '<div>'
        + '<div class="flex items-center justify-between gap-2 mb-2">'
          + codeLink(r.code)
          + '<span class="text-xs font-semibold text-lavender-700 bg-lavender-100 px-2.5 py-1 rounded-full">' + weeksText + '</span>'
        + '</div>'
        + '<h3 class="font-bold text-slate-800 text-base leading-snug mb-3">' + highlight(r.title, state.search.trim()) + '</h3>'
        + '<div class="space-y-2 text-xs text-slate-600">'
          + '<div class="flex items-center gap-2">'
            + '<svg class="w-4 h-4 text-lavender-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
            + '<span><strong class="font-medium text-slate-700">' + escapeHtml(dayLabel) + '</strong> · ' + escapeHtml(timeText) + '</span>'
          + '</div>'
          + '<div class="flex items-center gap-2">'
            + '<svg class="w-4 h-4 text-lavender-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>'
            + '<span class="truncate">' + (r.venue && r.venue !== 'N/A' ? highlight(r.venue, state.venue !== '__N/A__' ? (state.venue || state.search.trim()) : state.search.trim()) : '<span class="text-slate-400 italic">N/A</span>') + '</span>'
          + '</div>'
          + '<div class="flex items-start gap-2">'
            + '<svg class="w-4 h-4 text-lavender-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>'
            + '<span class="leading-relaxed">' + (r.staff && r.staff !== 'Not Applicable' ? highlight(r.staff, state.staff || state.search.trim()) : '<span class="text-slate-400 italic">Not Applicable</span>') + '</span>'
          + '</div>'
        + '</div>'
      + '</div>'
      + '<div class="pt-3 border-t border-lavender-100 flex items-center justify-between text-xs text-slate-400">'
        + '<span>每 ' + r.every + ' 週一次 (Every ' + r.every + ' wk)</span>'
      + '</div>'
    + '</div>';
  }).join('');
}

function renderContent() {
  const filteredSorted = getFilteredAndSorted();
  const total = filteredSorted.length;
  const perPage = state.pageSize === 'all' ? total : state.pageSize;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  if (state.page > totalPages) state.page = totalPages;
  const startIdx = (state.page - 1) * perPage;
  const rows = state.pageSize === 'all' ? filteredSorted : filteredSorted.slice(startIdx, startIdx + perPage);

  $('empty-state').classList.toggle('hidden', total > 0);

  // Toggle View Display
  if (state.view === 'table') {
    $('table-container').classList.remove('hidden');
    $('card-container').classList.add('hidden');
    renderTableHeader();
    renderTableRows(rows, startIdx);
  } else {
    $('table-container').classList.add('hidden');
    $('card-container').classList.remove('hidden');
    renderCards(rows);
  }

  // Update View Switcher buttons
  $('view-table-btn').className = 'flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg transition '
    + (state.view === 'table' ? 'shadow-sm bg-white text-lavender-800' : 'text-slate-600 hover:text-lavender-700');
  $('view-card-btn').className = 'flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg transition '
    + (state.view === 'card' ? 'shadow-sm bg-white text-lavender-800' : 'text-slate-600 hover:text-lavender-700');

  // Stats & info
  $('stat-total').textContent = DATA.length;
  $('stat-subjects').textContent = new Set(DATA.map(r => r.code)).size;

  const allStaffSet = new Set(DATA.flatMap(r => r.staff.split(',').map(s => s.trim())).filter(s => s && s !== 'Not Applicable'));
  $('stat-staff').textContent = allStaffSet.size;
  $('stat-filtered').textContent = total;

  $('result-info').textContent = total === DATA.length
    ? '顯示全部 ' + total + ' 個時段'
    : '篩選後共 ' + total + ' 個時段（全部 ' + DATA.length + ' 個）';

  $('page-info').textContent = total === 0
    ? ''
    : (state.pageSize === 'all'
        ? '顯示全部 ' + total + ' 筆'
        : '第 ' + (startIdx + 1) + '–' + Math.min(startIdx + perPage, total) + ' 筆，共 ' + total + ' 筆');

  renderPagination(totalPages, total);
  updatePageSizeButtons();
}

function renderPagination(totalPages, total) {
  const wrap = $('pagination-controls');
  if (state.pageSize === 'all' || totalPages <= 1) { wrap.innerHTML = ''; return; }
  const btn = (label, page, opts) => {
    opts = opts || {};
    const base = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition ';
    if (opts.disabled) return '<span class="' + base + 'text-slate-300 cursor-not-allowed">' + label + '</span>';
    if (opts.active) return '<span class="' + base + 'bg-lavender-600 text-white shadow-soft">' + label + '</span>';
    return '<button data-page="' + page + '" class="' + base + 'text-lavender-700 bg-white border border-lavender-200 hover:bg-lavender-100">' + label + '</button>';
  };
  let html = btn('‹ 上一頁', state.page - 1, { disabled: state.page === 1 });
  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || Math.abs(p - state.page) <= 1) pages.push(p);
  }
  let prev = 0;
  pages.forEach(p => {
    if (prev && p - prev > 1) {
      html += '<span class="px-2 py-1 text-slate-400 text-xs">...</span>';
    }
    html += btn(p, p, { active: p === state.page });
    prev = p;
  });
  html += btn('下一頁 ›', state.page + 1, { disabled: state.page === totalPages });
  wrap.innerHTML = html;
}

function updatePageSizeButtons() {
  document.querySelectorAll('.page-size-btn').forEach(b => {
    const sz = b.dataset.size;
    const isSel = (sz === 'all' && state.pageSize === 'all') || Number(sz) === state.pageSize;
    b.className = 'page-size-btn px-3.5 py-1.5 text-xs font-semibold transition ' +
      (isSel ? 'bg-lavender-600 text-white' : 'bg-white text-slate-600 hover:bg-lavender-50');
  });
}

function populateVenueFilter() {
  const venueSelect = $('venue-filter');
  const venueSet = new Set();

  DATA.forEach(r => {
    if (r.venue && r.venue !== 'N/A') {
      r.venue.split(',').forEach(v => {
        const cleaned = v.trim();
        if (cleaned) venueSet.add(cleaned);
      });
    }
  });

  const sortedVenues = Array.from(venueSet).sort((a, b) => a.localeCompare(b));
  venueSelect.innerHTML = '<option value="">全部地點</option>'
    + sortedVenues.map(v => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('')
    + '<option value="__N/A__">未定 / 不適用 (N/A)</option>';
}

function populateStaffFilter() {
  const staffSelect = $('staff-filter');
  const staffSet = new Set();

  DATA.forEach(r => {
    if (r.staff && r.staff !== 'Not Applicable') {
      r.staff.split(',').forEach(s => {
        const cleaned = s.trim();
        if (cleaned) staffSet.add(cleaned);
      });
    }
  });

  const sortedStaff = Array.from(staffSet).sort((a, b) => a.localeCompare(b));
  staffSelect.innerHTML = '<option value="">全部教師</option>'
    + sortedStaff.map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join('');
}

/* ================= Export ================= */
function exportExcel() {
  const filteredSorted = getFilteredAndSorted();
  if (filteredSorted.length === 0) {
    showToast('目前沒有可匯出的資料。');
    return;
  }
  const rows = filteredSorted.map(r => ({
    'Subject Code': r.code,
    'Subject Title': r.title,
    'Day of Week': r.day || 'TBA',
    'Start Time': r.start || '',
    'End Time': r.end || '',
    'Venue': r.venue,
    'Teaching Staff': r.staff,
    'For Every (Week)': r.every,
    'Start Week': r.startWeek,
    'End Week': r.endWeek,
    'Subject PDF Link': CODE_REGEX.test(r.code)
      ? 'https://www.polyu.edu.hk/comp/docdrive/tpg/subject/' + r.code + '.pdf'
      : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:52},{wch:12},{wch:11},{wch:10},{wch:34},{wch:36},{wch:16},{wch:11},{wch:10},{wch:70}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'COMP Timetable');
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, 'PolyU_COMP_Timetable_' + stamp + '.xlsx');
}

/* ================= Events ================= */
let searchTimer;
$('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value; state.page = 1; renderContent(); }, 180);
});
$('day-filter').addEventListener('change', e => { state.day = e.target.value; state.page = 1; renderContent(); });
$('venue-filter').addEventListener('change', e => { state.venue = e.target.value; state.page = 1; renderContent(); });
$('staff-filter').addEventListener('change', e => { state.staff = e.target.value; state.page = 1; renderContent(); });

$('clear-btn').addEventListener('click', () => {
  state.search = ''; state.day = ''; state.venue = ''; state.staff = ''; state.page = 1;
  $('search-input').value = ''; $('day-filter').value = ''; $('venue-filter').value = ''; $('staff-filter').value = '';
  renderContent();
});

$('export-btn').addEventListener('click', exportExcel);

// View Mode switchers
$('view-table-btn').addEventListener('click', () => {
  state.view = 'table';
  renderContent();
});
$('view-card-btn').addEventListener('click', () => {
  state.view = 'card';
  renderContent();
});

// Table Header Sort Click
$('table-header').addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const colKey = th.dataset.sort;
  if (state.sortCol === colKey) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortCol = colKey;
    state.sortDir = 'asc';
  }
  renderContent();
});

// Page size switchers
document.querySelectorAll('.page-size-btn').forEach(b => {
  b.addEventListener('click', () => {
    state.pageSize = b.dataset.size === 'all' ? 'all' : Number(b.dataset.size);
    state.page = 1;
    renderContent();
  });
});

// Pagination clicks
$('pagination-controls').addEventListener('click', e => {
  const btn = e.target.closest('button[data-page]');
  if (!btn) return;
  state.page = Number(btn.dataset.page);
  renderContent();
  $('content-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ================= Init ================= */
(function init() {
  populateVenueFilter();
  populateStaffFilter();
  renderContent();
})();
</script>
