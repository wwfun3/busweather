  function overview(){let ranks=P.slice(0,3).map((p,i)=>`<div class="rank"><div class="rank-no">0${i+1}</div><div><small>${district(p)}</small><h3>${name(p)}</h3><small>${txt('綜合自住分數','Self-use score')}</small></div><div class="bar"><i style="width:${p[4]*10}%"></i></div><div class="score">${p[4].toFixed(2)}</div></div>`).join('');return `<div class="hero"><div class="hero-copy"><p class="eyebrow">● ${txt('自住比較研究／2026.08','SELF-USE STUDY / 2026.08')}</p><h1>${txt('把每天省下的<br><span class="orange">十二分鐘</span>，放回<br>十年自住週期。','Put the minutes you save each day back into <span class="orange">ten years.</span>')}</h1><p>${txt('十個新盤、兩個工作站、同一套透明模型。為大學站與紅磡站雙職家庭，拆解真正的通勤、首期與生活取捨。','Ten projects. Two workplaces. One transparent model for a University–Hung Hom dual-career household.')}</p><div class="actions"><button class="primary" onclick="tab('comparison')">${txt('查看完整排序','View ranking')} →</button><button class="secondary" onclick="tab('commute')">${txt('打開通勤實驗室','Open commute lab')} ↓</button></div></div></div><div class="strip"><span>${txt('工作約束','WORK CONSTRAINT')}</span><b>${txt('一人：港鐵大學站　／　一人：港鐵紅磡站','ONE: UNIVERSITY STATION / ONE: HUNG HOM STATION')}</b><span>22 ${txt('個工作天／月','WORKDAYS / MONTH')}</span></div><section class="wrap three"><div><p class="eyebrow">${txt('第一個結論','FIRST FINDING')}</p><div class="index">01</div></div><div class="copy"><h2>${txt('通勤最短的盤，未必最平；<span class="orange">但最平的盤</span>，常把成本藏在第一段路。','The shortest commute is not the cheapest; <span class="orange">the cheapest hides cost in the first mile.</span>')}</h2><p>${txt('首岸第4期以紅磡步行半徑及東鐵綫直達大學站，取得最高家庭通勤效率；模型把大堂、接駁、候車、轉乘與最後步行放在同一張表。','One Victoria Cove wins household commute efficiency. The model puts lobby, feeder, wait, interchange and final walk on the same page.')}</p><button class="secondary" onclick="tab('commute')">${txt('比較兩條工作路線','Compare work routes')} →</button></div><div class="metrics"><div class="metric"><b>14 min</b><span>${txt('首岸 → 紅磡','OVC → Hung Hom')}</span></div><div class="metric"><b>24 min</b><span>${txt('大學山 → 大學','UH → University')}</span></div><div class="metric"><b>HK$862</b><span>${txt('最低模型月費','lowest monthly fare')}</span></div></div></section><section class="wrap"><div class="section-head"><div><p class="eyebrow">${txt('自住優先序','SELF-USE PRIORITY')}</p><h2>${txt('先看平衡，再看價格。','Balance first. Price second.')}</h2></div><button class="secondary" onclick="tab('comparison')">${txt('十盤矩陣','All ten')} →</button></div><div class="ranks">${ranks}</div></section>`}
  function commute(){let p=P[selected];let chips=P.map((x,i)=>`<button class="chip ${i===selected?'active':''}" onclick="selected=${i};render()"><b>${i+1}</b> ${name(x)}</button>`).join('');let card=(label,station,min,fee,path,risk)=>`<article class="route ${risk?'riskline':''}"><small>${label}</small><h3>${station}</h3><div class="route-stats"><div><b>${min}</b><span>${txt('分鐘','min')}</span></div><div><b>${risk?0:(min===49||min===51||min===53||min===56||min===78?1:0)}</b><span>${txt('次轉乘','transfers')}</span></div><div><b>${fee.toFixed(1)}</b><span>HK$</span></div></div><div class="path">${path}</div></article>`;return `<section class="intro"><p class="eyebrow">02／${txt('通勤實驗室','COMMUTE LAB')}</p><h1>${txt('兩條工作路徑，如何在同一個家相遇？','How do two work routes meet at one home?')}</h1><p>${txt('選取項目，查看兩位住戶由屋苑出入口至工作站的門對門模型。時間包括接駁、候車、轉乘及最後步行。','Select a project to inspect each resident’s door-to-door model, including feeder, wait, interchange and final walk.')}</p></section><div class="tab-layout"><aside class="rail"><b>02</b><p>${txt('通勤圖例','COMMUTE LEGEND')}</p><div class="legend blue"><span class="dot">UNI</span>${txt('大學站職點','University')}</div><div class="legend blue"><span class="dot">HOM</span>${txt('紅磡站職點','Hung Hom')}</div><div class="legend risk"><span class="dot">⧖</span>${txt('橙色＝時間／摩擦','Orange = time')}</div></aside><div class="content"><div class="selector">${chips}</div><div class="selection"><div><p class="eyebrow">${txt('目前選取','CURRENT SELECTION')}</p><h2>${name(p)}</h2><span class="sub">${district(p)} · ${txt('繁忙時段模型','Peak-hour model')}</span></div><div class="big">${p[4].toFixed(2)}</div></div><div class="routes">${card(txt('住戶 A','RESIDENT A'),txt('港鐵大學站','University Station'),p[5],p[7],zh?p[15]:p[16])}${card(txt('住戶 B','RESIDENT B'),txt('港鐵紅磡站','Hung Hom Station'),p[6],p[8],zh?p[17]:p[18],true)}</div><div class="household"><span>${txt('合併的家庭成本：22 個工作天的成人八達通模型。','Combined household cost: adult Octopus model at 22 workdays.')}</span><strong>HK$${p[9].toLocaleString()}</strong></div></div></div>`}
  function comparison(){let bars=P.map((p,i)=>`<div class="chart-row ${i<3?'top':''}"><span>${name(p)}</span><div class="bar"><i style="width:${p[4]*10}%"></i></div><b>${p[4].toFixed(2)}</b></div>`).join('');let rows=P.map((p,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td><b>${name(p)}</b><br><small>${district(p)}</small></td>${p.slice(10,15).map(v=>`<td><span class="pill">${v.toFixed(1)}</span></td>`).join('')}<td><b>${p[4].toFixed(2)}</b></td></tr>`).join('');return `<section class="intro"><p class="eyebrow">03／${txt('評分矩陣','SCORING MATRIX')}</p><h1>${txt('把十個盤，放進同一把尺。','Put ten projects on one transparent scale.')}</h1><p>${txt('40% 交通、20% 生活、15% 品牌與物業、15% 入伙與開價、10% 防守力。權重公開，讓你可以質疑，也可以重算。','40% transport, 20% lifestyle, 15% brand, 15% entry, 10% defensiveness. The weights are public.')}</p></section><div class="tab-layout"><aside class="rail"><b>03</b><p>${txt('權重圖例','WEIGHT LEGEND')}</p><div class="legend blue">40 ${txt('交通效率','Transport')}</div><div class="legend">20 ${txt('生活配套','Lifestyle')}</div><div class="legend risk">15 ${txt('入伙／開價','Entry')}</div></aside><div class="content"><div class="chart"><h2>${txt('雙職自住比較：總分與平均通勤時間','Dual-career comparison: score and commute')}</h2>${bars}<p class="disclaimer">${txt('資料截點：2026.08.17。橙色時間成本及接駁摩擦已反映於交通分數。','Cut-off: 17 Aug 2026. Time cost and feeder friction are captured in transport scoring.')}</p></div><div class="section-head"><div><p class="eyebrow">${txt('完整可比表','FULL COMPARISON')}</p><h2>${txt('排名背後，是五項明確的取捨。','Behind every rank are five trade-offs.')}</h2></div></div><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>${txt('項目／地區','Project / district')}</th><th>${txt('通勤','Transit')}</th><th>${txt('生活','Life')}</th><th>${txt('品牌','Brand')}</th><th>${txt('入伙','Entry')}</th><th>${txt('防守','Defence')}</th><th>${txt('綜合','Overall')}</th></tr></thead><tbody>${rows}</tbody></table></div><div class="radar-box"><div><p class="eyebrow">${txt('前五名輪廓','TOP 5 PROFILES')}</p><h2>${txt('相近總分，未必代表同一種生活。','Similar totals do not mean the same life.')}</h2><p class="sub">${txt('首岸勝在通勤；上然與 Sierra Sea 則以較高入場分交換首段接駁時間。','OVC wins transport; Le Mont and Sierra Sea exchange feeder time for entry value.')}</p></div><div class="radar"></div></div></div></div>`}
  function method(){let sources=[['MTR Corporation / data.gov.hk — MTR Lines Fares (2026)','https://opendata.mtr.com.hk/data/mtr_lines_fares.csv'],['MTR Corporation — Metro Fare Matrix FAM2024 v3','https://www.mtr.com.hk/archive/ch/pdf/1_Metro_Fare_Matrix_FAM2024_Master_v3.pdf'],['香港巴士時間 — 272A（白石角／大學站）','https://hkbustime.com/businfo/272A'],['香港巴士時間 — 581（西沙灣／烏溪沙）','https://hkbustime.com/businfo/ctb/581'],['16 Seats — 20S（馬窩／大埔墟）','https://www.16seats.net/chi/gmb/gn_20s.html'],['16 Seats — 602C（爾巒／錦上路）','https://www.16seats.net/chi/gmb/gn_602c.html']];return `<section class="intro"><p class="eyebrow">04／${txt('方法與來源','METHOD & SOURCES')}</p><h1>${txt('每一個分數，都應有一條可追溯的路。','Every score should have a traceable route.')}</h1><p>${txt('本研究不把模型偽裝成預測；資料有層級，限制也有名字。','This study does not disguise a model as a forecast. Data has hierarchy—and limitations have names.')}</p></section><div class="tab-layout"><aside class="rail"><b>04</b><p>${txt('資料索引','DATA INDEX')}</p><div class="legend"><span class="dot">A</span>${txt('官方銷售資料','Official data')}</div><div class="legend"><span class="dot">B</span>${txt('平台快照','Platform snapshot')}</div><div class="legend blue"><span class="dot">C</span>${txt('交通模型','Commute model')}</div></aside><div class="content"><div class="method-grid"><article class="method-card"><p class="eyebrow">${txt('資料層級','DATA HIERARCHY')}</p><h2>${txt('先官方，後平台，再到模型。','Official first. Platform second. Model last.')}</h2><p>${txt('期數、戶數、關鍵日期及價單入口優先對照發展商和監管連結；主流平台及新聞作截點快照與交叉核對。','Phase, unit count, material date and price-list data are checked against developer and regulatory sources first.')}</p></article><article class="method-card"><p class="eyebrow">${txt('公式公開','OPEN FORMULA')}</p><p class="formula">S = .40T + .20L + .15B + .15E + .10D</p><p>${txt('T 為通勤、L 為生活、B 為品牌與物業、E 為入伙與開價、D 為防守力。','T is transport, L lifestyle, B brand, E entry, and D defensiveness.')}</p></article><article class="method-card"><p class="eyebrow">${txt('票價口徑','FARE BASIS')}</p><h2>${txt('成人八達通＋具體首段接駁。','Adult Octopus plus named first-mile feeder.')}</h2><p>${txt('港鐵站對取自 MTR 開放 CSV；272A 與 581 取自交通署開放車費。專線小巴 20S、602C 以公開路線資料核對；月費已就兩線的港鐵轉乘優惠每程 HK$0.5 入帳。','MTR pairs use MTR open CSV; 272A and 581 use Transport Department fare data. GMB 20S and 602C are cross-checked against public route data; monthly costs include their HK$0.5 MTR interchange saving per eligible transfer.')}</p></article></div><section><p class="eyebrow">${txt('簽約前必做','BEFORE SIGNING')}</p><h2>${txt('把研究變成一次真正的看樓。','Turn research into a real viewing.')}</h2><ol class="checklist"><li>${txt('下載最新價單、售樓說明書、銷售安排與成交紀錄冊，重算自己可享折扣。','Download current documents and recalculate your actual discount.')}</li><li>${txt('以真實收入及負債取得按揭預批，另留印花、律師與裝修緩衝。','Seek mortgage pre-approval against actual income and reserve closing costs.')}</li><li>${txt('在兩個平日繁忙時段完成門對門實測，特別是接駁巴士和最後步行。','Run two peak-hour door-to-door trials, especially the feeder and final walk.')}</li></ol></section><section class="sources"><p class="eyebrow">APA 7 · SELECTED REFERENCES</p><h2>${txt('主要可追溯來源','Key traceable sources')}</h2>${sources.map((s,i)=>`<a class="source" target="_blank" rel="noreferrer" href="${s[1]}"><b>${String(i+1).padStart(2,'0')}</b><span>${s[0]}</span><span>↗</span></a>`).join('')}<p class="disclaimer">${txt('2026.08 核對：MTR 票價矩陣 PDF 可作 2024 基準；HTML 的港鐵數字以 MTR 公開 CSV（資源頁標示 2026-04-03 更新）為現行可下載口徑。','Aug 2026 check: the MTR matrix PDF is a 2024 benchmark; this HTML uses the current downloadable MTR CSV (resource page: 3 Apr 2026) for MTR figures.')}</p></section></div></div>`}
  function render(){nav();$('overview').innerHTML=overview();$('commute').innerHTML=commute();$('comparison').innerHTML=comparison();$('method').innerHTML=method();document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===active))}render();
  </script>
</body>
</html>
