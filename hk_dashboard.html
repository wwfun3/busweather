<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的儀表板 · HK Dashboard</title>
  <meta name="description" content="香港生活即時儀表板：天氣預報、九巴到站時間、匯率指數、新聞及公眾假期 · Real-time Hong Kong dashboard">
  <meta name="theme-color" content="#F5F5F7" id="theme-color-meta">
  
  <!-- Inline FOUC-guard script BEFORE styles/render -->
  <script>
    try {
      var p = localStorage.getItem("hk-dashboard-accent");
      if (p === "purple") document.documentElement.setAttribute("data-accent", "purple");
      var d = localStorage.getItem("hk-dashboard-theme");
      if (d === "dark" || (!d && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch(e) {}
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            popover: 'var(--popover)',
            primary: 'var(--primary)',
            secondary: 'var(--secondary)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            destructive: 'var(--destructive)',
            border: 'var(--border)',
            ring: 'var(--ring)',
            kmb: '#C8262F',
            up: '#16A34A',
            down: '#DC2626'
          },
          borderRadius: {
            xl: 'var(--radius)',
            '2xl': 'calc(var(--radius) + 4px)'
          },
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"SF Pro Text"',
              '"SF Pro Display"',
              '"Segoe UI"',
              '"PingFang TC"',
              '"Microsoft JhengHei"',
              '"Noto Sans TC"',
              'sans-serif'
            ]
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --background: #F5F5F7;
      --foreground: #1D1D1F;
      --card: #FFFFFF;
      --popover: #FFFFFF;
      --primary: #007AFF;
      --secondary: #E8E8ED;
      --muted: #ECECF0;
      --muted-foreground: #86868B;
      --destructive: #FF3B30;
      --border: rgba(0, 0, 0, 0.08);
      --ring: #007AFF;
      --radius: 0.875rem;
    }

    html.dark {
      --background: #000000;
      --foreground: #F5F5F7;
      --card: #1C1C1E;
      --popover: #2C2C2E;
      --primary: #0A84FF;
      --secondary: #2C2C2E;
      --muted: #2C2C2E;
      --muted-foreground: #98989D;
      --destructive: #FF453A;
      --border: rgba(255, 255, 255, 0.12);
      --ring: #0A84FF;
    }

    html[data-accent="purple"] {
      --background: #F3EEFB;
      --foreground: #1F1B2E;
      --card: #FFFFFF;
      --popover: #FFFFFF;
      --primary: #AF52DE;
      --secondary: #ECE4F7;
      --muted: #F0EAF8;
      --muted-foreground: #857E96;
      --destructive: #FF3B30;
      --border: rgba(88, 28, 135, 0.10);
      --ring: #AF52DE;
    }

    html.dark[data-accent="purple"] {
      --background: #0E0A16;
      --foreground: #F3EEFB;
      --card: #171221;
      --popover: #221A30;
      --primary: #BF5AF2;
      --secondary: #221A30;
      --muted: #221A30;
      --muted-foreground: #9B93AD;
      --destructive: #FF453A;
      --border: rgba(191, 90, 242, 0.16);
      --ring: #BF5AF2;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 35%, transparent);
      border-radius: 9999px;
    }

    @keyframes spin-fast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-active {
      animation: spin-fast 0.8s linear infinite;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans selection:bg-primary/20">

  <header class="sticky top-0 z-40 w-full bg-background/80 backdrop-blur-md border-b border-border/60 transition-colors duration-200">
    <div class="max-w-[1440px] mx-auto px-3 sm:px-4 py-2 flex items-center justify-between">
      <!-- Live Hong Kong Time & Date -->
      <div class="flex flex-col select-none">
        <div id="hk-clock" class="text-xl sm:text-2xl font-semibold tracking-tight tabular-nums text-foreground leading-none">
          --:--
        </div>
        <div id="hk-date" class="text-[10.5px] font-medium text-muted-foreground mt-0.5 tabular-nums leading-none">
          香港時間
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Update All Button -->
        <button id="btn-update-all" class="h-8 px-2.5 sm:px-3 text-xs font-medium rounded-lg border border-border/80 bg-card hover:bg-muted text-foreground transition-all flex items-center gap-1.5 shadow-sm active:scale-95">
          <svg id="icon-update-all" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="hidden sm:inline" id="txt-update-all">全部更新</span>
        </button>

        <!-- Language toggle button -->
        <button id="btn-lang" class="h-8 px-2.5 sm:px-3 text-xs font-medium rounded-lg border border-border/80 bg-card hover:bg-muted text-foreground transition-all flex items-center gap-1 shadow-sm active:scale-95" title="切換語言 / Switch Language">
          <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
          </svg>
          <span id="txt-lang-badge" class="font-semibold">EN</span>
        </button>

        <!-- Accent Purple Palette Button -->
        <button id="btn-palette" class="h-8 w-8 flex items-center justify-center rounded-lg border border-border/80 bg-card hover:bg-muted text-foreground transition-all shadow-sm active:scale-95" aria-label="Toggle Purple Accent" title="主題色彩 / Theme Accent">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="8" cy="8" r="5.5" class="opacity-85 text-primary" fill="currentColor" fill-opacity="0.2"/>
            <circle cx="16" cy="16" r="5.5" class="opacity-85 text-foreground" stroke="currentColor"/>
          </svg>
        </button>

        <!-- Dark/Light Theme Toggle -->
        <button id="btn-theme" class="h-8 w-8 flex items-center justify-center rounded-lg border border-border/80 bg-card hover:bg-muted text-foreground transition-all shadow-sm active:scale-95" aria-label="Toggle Dark Mode" title="深色模式 / Dark Mode">
          <svg id="icon-theme-sun" class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          <svg id="icon-theme-moon" class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <!-- Settings Gear Button -->
        <button id="btn-settings" class="h-8 w-8 flex items-center justify-center rounded-lg border border-border/80 bg-card hover:bg-muted text-foreground transition-all shadow-sm active:scale-95" aria-label="Settings" title="儀表板設定 / Settings">
          <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1440px] w-full mx-auto px-2.5 sm:px-4 py-3">
    <!-- Initial Skeleton Loading Gate -->
    <div id="skeleton-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2.5">
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-2 lg:col-span-3"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-2 lg:col-span-6"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-1 lg:col-span-3"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-1 lg:col-span-4"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-1 lg:col-span-4"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-1 lg:col-span-4"></div>
      <div class="h-32 rounded-xl bg-muted/60 animate-pulse col-span-1 sm:col-span-2 lg:col-span-12"></div>
    </div>

    <!-- Active Card Grid -->
    <div id="cards-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2.5 grid-flow-row-dense auto-rows-auto">
      <!-- 17 Cards will be mounted dynamically here in order -->
    </div>
  </main>

  <footer class="mt-auto py-4 border-t border-border/40 text-center text-[10px] text-muted-foreground select-none">
    <div class="max-w-[1440px] mx-auto px-4">
      HK Dashboard · <span id="footer-year">2026</span> · 香港天文台 / 九巴 / Yahoo Finance / ESPN / ER-API
    </div>
  </footer>

  <!-- Settings Modal Backdrop -->
  <div id="settings-dialog" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-4">
    <div class="bg-card text-card-foreground border border-border w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Modal Header -->
      <div class="px-4 py-3 border-b border-border/80 flex items-center justify-between">
        <h3 id="settings-title" class="text-sm font-semibold text-foreground flex items-center gap-2">
          <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
          儀表板設定 / Dashboard Settings
        </h3>
        <button id="btn-close-settings" class="p-1 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-4 space-y-5 overflow-y-auto thin-scroll text-xs">
        
        <!-- Section 1: Interface Language -->
        <div>
          <label id="lbl-setting-lang" class="block font-semibold mb-1.5 text-foreground">介面語言 / Interface Language</label>
          <div class="grid grid-cols-2 gap-1.5 p-1 bg-muted rounded-xl">
            <button type="button" data-lang="tc" class="lang-opt-btn py-1.5 font-medium rounded-lg text-center transition-all bg-card text-foreground shadow-sm">繁體中文</button>
            <button type="button" data-lang="en" class="lang-opt-btn py-1.5 font-medium rounded-lg text-center transition-all text-muted-foreground hover:text-foreground">English</button>
          </div>
        </div>

        <!-- Section 2: Card Display and Ordering -->
        <div>
          <label id="lbl-setting-cards" class="block font-semibold mb-1.5 text-foreground">卡片顯示及排序 / Cards & Order</label>
          <div id="settings-cards-list" class="space-y-1.5 max-h-56 overflow-y-auto thin-scroll p-1 border border-border/60 rounded-xl bg-background/50">
            <!-- Dynamically populated card rows -->
          </div>
        </div>

        <!-- Section 3: Bus Cards Configuration -->
        <div id="bus-settings-section">
          <div class="flex items-center justify-between mb-1.5">
            <label id="lbl-setting-bus" class="font-semibold text-foreground">巴士卡設定 / Bus Cards Setup</label>
            <span class="text-[10px] text-muted-foreground">支援九巴／龍運路線</span>
          </div>
          
          <div id="bus-cards-editors" class="space-y-3">
            <!-- 7 Bus Slot Editors will be generated dynamically -->
          </div>
        </div>

        <!-- Section 4: Football League Selection -->
        <div>
          <label id="lbl-setting-league" class="block font-semibold mb-1.5 text-foreground">足球聯賽 / Football League</label>
          <select id="settings-league-select" class="w-full bg-background border border-border text-foreground rounded-lg px-2.5 py-1.5 text-xs outline-none focus:ring-1 focus:ring-primary">
            <option value="all">全部聯賽 · Show All</option>
            <option value="eng.1">英超 · Premier League</option>
            <option value="esp.1">西甲 · La Liga</option>
            <option value="ita.1">意甲 · Serie A</option>
            <option value="ger.1">德甲 · Bundesliga</option>
            <option value="fra.1">法甲 · Ligue 1</option>
            <option value="uefa.champions">歐聯 · UEFA Champions League</option>
            <option value="uefa.europa">歐霸 · UEFA Europa League</option>
            <option value="eng.2">英冠 · Championship</option>
          </select>
        </div>

        <!-- Section 5: Reset All Settings -->
        <div class="pt-2 border-t border-border/80">
          <button id="btn-open-reset-confirm" class="w-full py-2 px-3 text-xs font-semibold text-destructive hover:bg-destructive/10 border border-destructive/30 rounded-xl transition-all flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span id="txt-reset-all">重設全部設定 / Reset all settings</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal (Strictly avoids window.alert / confirm) -->
  <div id="confirm-dialog" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-card text-card-foreground border border-border w-full max-w-xs rounded-2xl p-4 shadow-2xl text-center space-y-3">
      <div class="w-10 h-10 mx-auto rounded-full bg-destructive/10 text-destructive flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h4 class="text-sm font-semibold text-foreground" id="confirm-title">確認重設設定？</h4>
      <p class="text-xs text-muted-foreground" id="confirm-desc">所有自訂巴士路線、卡片順序及選項將回復原廠預設值。</p>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btn-confirm-cancel" class="py-1.5 text-xs font-medium rounded-lg bg-muted text-foreground hover:bg-muted/80">取消</button>
        <button id="btn-confirm-ok" class="py-1.5 text-xs font-medium rounded-lg bg-destructive text-white hover:bg-destructive/90">確認重設</button>
      </div>
    </div>
  </div>

    function computeSunHK(date = new Date()) {
      // Coordinates for Tuen Mun, Hong Kong
      const lat = 22.3917;
      const lng = 113.9758;
      
      const calcForDate = (d) => {
        const rad = Math.PI / 180;
        const startOfYear = new Date(Date.UTC(d.getFullYear(), 0, 1));
        const dayOfYear = Math.floor((d.getTime() - startOfYear.getTime()) / (86400000)) + 1;
        
        // Solar declination
        const b = (360 / 365) * (dayOfYear - 81) * rad;
        const eot = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
        const decl = 23.45 * Math.sin(b) * rad;
        
        // Hour angle
        const latRad = lat * rad;
        const cosH = (Math.cos(90.833 * rad) - Math.sin(latRad) * Math.sin(decl)) / (Math.cos(latRad) * Math.cos(decl));
        const clampedCosH = Math.max(-1, Math.min(1, cosH));
        const H = Math.acos(clampedCosH) / rad;
        
        // Solar noon in minutes from midnight UTC
        const solarNoonMinutes = 720 - 4 * lng - eot;
        const sunriseMinutes = solarNoonMinutes - H * 4;
        const sunsetMinutes = solarNoonMinutes + H * 4;
        
        // Convert to HK Date objects (UTC+8)
        const sunriseDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, sunriseMinutes));
        const sunsetDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, sunsetMinutes));
        const dayLengthMin = Math.round(sunsetMinutes - sunriseMinutes);
        
        return {
          sunrise: sunriseDate,
          sunset: sunsetDate,
          dayLengthMin: dayLengthMin
        };
      };

      const todaySun = calcForDate(date);
      const tomorrowDate = new Date(date.getTime() + 86400000);
      const tomorrowSun = calcForDate(tomorrowDate);

      return {
        today: todaySun,
        tomorrow: tomorrowSun
      };
    }

    function sanitiseSettings(st) {
      if (!st || typeof st !== "object") return getDefaultSettings();
      const def = getDefaultSettings();
      const lang = st.lang === "en" ? "en" : "tc";
      const league = typeof st.league === "string" ? st.league : "all";
      
      let order = Array.isArray(st.order) ? st.order.filter(id => DEFAULT_CARD_ORDER.includes(id)) : [];
      DEFAULT_CARD_ORDER.forEach(id => {
        if (!order.includes(id)) order.push(id);
      });

      let hidden = Array.isArray(st.hidden) ? st.hidden.filter(id => DEFAULT_CARD_ORDER.includes(id)) : [...def.hidden];
      
      const bus = {};
      const busSlots = ["busCustom1", "busCustom2", "busCustom3", "busCustom4", "busCustom5", "busFortune", "busTMR", "busKlnBay"];
      busSlots.forEach(slot => {
        const src = st.bus && st.bus[slot];
        if (!src) {
          bus[slot] = JSON.parse(JSON.stringify(DEFAULT_BUS_CONFIGS[slot]));
        } else {
          const stops = Array.isArray(src.stops) ? src.stops.slice(0, 6) : DEFAULT_BUS_CONFIGS[slot].stops;
          const routes = Array.isArray(src.routes) ? src.routes.slice(0, 12) : DEFAULT_BUS_CONFIGS[slot].routes;
          const showCount = [1, 2, 3].includes(src.showCount) ? src.showCount : 2;
          bus[slot] = { stops, routes, showCount };
        }
      });

      return { lang, order, hidden, bus, league };
    }

    function loadSettings() {
      // 1. Try v14
      const raw14 = localStorage.getItem(STORAGE_KEY_V14);
      if (raw14) {
        try {
          const parsed = sanitiseSettings(JSON.parse(raw14));
          if (!parsed.order.includes("busCustom5")) {
            const idx4 = parsed.order.indexOf("busCustom4");
            if (idx4 >= 0) parsed.order.splice(idx4 + 1, 0, "busCustom5");
            else parsed.order.push("busCustom5");
          }
          if (!parsed.bus.busCustom5) {
            parsed.bus.busCustom5 = { stops: [], routes: [], showCount: 2 };
          }
          return parsed;
        } catch(e) {}
      }

      // 2. Migration chain from legacy keys
      const legacyKeys = [
        "hk-dashboard-settings-v13",
        "hk-dashboard-settings-v12",
        "hk-dashboard-settings-v11",
        "hk-dashboard-settings-v10",
        "hk-dashboard-settings-v1"
      ];

      for (const k of legacyKeys) {
        const raw = localStorage.getItem(k);
        if (raw) {
          try {
            const old = JSON.parse(raw);
            const upgraded = sanitiseSettings(old);
            
            if (!upgraded.order.includes("busCustom4")) {
              const idx3 = upgraded.order.indexOf("busCustom3");
              if (idx3 >= 0) upgraded.order.splice(idx3 + 1, 0, "busCustom4");
              else upgraded.order.push("busCustom4");
            }
            if (!upgraded.order.includes("busCustom5")) {
              const idx4 = upgraded.order.indexOf("busCustom4");
              if (idx4 >= 0) upgraded.order.splice(idx4 + 1, 0, "busCustom5");
              else upgraded.order.push("busCustom5");
            }
            if (!upgraded.bus.busCustom5) {
              upgraded.bus.busCustom5 = { stops: [], routes: [], showCount: 2 };
            }
            if (!upgraded.hidden.includes("busCustom5")) {
              upgraded.hidden.push("busCustom5");
            }
            if (Array.isArray(old.hidden) && old.hidden.length === 0) {
              upgraded.hidden = ["busCustom5", "busFortune", "football"];
            }

            saveSettings(upgraded);
            localStorage.removeItem(k);
            return upgraded;
          } catch(e) {}
        }
      }

      const fresh = getDefaultSettings();
      saveSettings(fresh);
      return fresh;
    }

    function timeAgo(timestamp, lang = "tc") {
      const diffSec = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSec < 60) return t("justNow", lang);
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}${t("minsAgo", lang)}`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}${t("hoursAgo", lang)}`;
      const days = Math.floor(hours / 24);
      return `${days}${t("daysAgo", lang)}`;
    }

    async function loadBusCard(slotId, isManual = false) {
      const lang = currentSettings.lang;
      const bodyEl = document.getElementById(`body-${slotId}`);
      if (!bodyEl) return;

      const conf = currentSettings.bus[slotId];
      if (!conf || !conf.routes || conf.routes.length === 0 || !conf.stops || conf.stops.length === 0) {
        bodyEl.innerHTML = `
          <div class="text-center py-4 text-xs text-muted-foreground">
            ${t("noBusConfig", lang)}
          </div>
        `;
        return;
      }

      try {
        // Fetch stops in parallel
        const stopPromises = conf.stops.map(s => fetchKmbStopEtas(s.id).catch(() => []));
        const stopResults = await Promise.all(stopPromises);
        const allEtas = stopResults.flat();

        const now = Date.now();
        const showCount = conf.showCount || 2;
        const isCustom = slotId.startsWith("busCustom");
        const stopPrefix = isCustom ? `${conf.stops[0].label} → ` : "→ ";

        const rowsHtml = conf.routes.map(rt => {
          const matching = allEtas.filter(item => item.route === rt && item.service_type === 1);
          
          if (matching.length === 0) {
            return `
              <div class="h-[34px] flex items-center justify-between py-1 border-b border-border/30 last:border-0" title="${t('routeMayNotServe', lang)}">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="inline-flex items-center justify-center min-w-[38px] px-1.5 h-5 text-xs font-bold text-white bg-kmb rounded-md leading-none select-none">
                    ${rt}
                  </span>
                  <span class="text-xs text-muted-foreground truncate">—</span>
                </div>
                <div class="text-xs text-muted-foreground font-medium">—</div>
              </div>
            `;
          }

          // Sort by timestamp
          const validEtas = matching
            .filter(item => item.eta)
            .map(item => ({
              ts: new Date(item.eta).getTime(),
              rmk: lang === "en" ? (item.rmk_en || item.rmk_tc) : item.rmk_tc,
              dest: lang === "en" ? (item.dest_en || item.dest_tc) : item.dest_tc
            }))
            .sort((a, b) => a.ts - b.ts);

          const destName = (validEtas[0] && validEtas[0].dest) || (matching[0] && (lang === "en" ? matching[0].dest_en : matching[0].dest_tc)) || "";

          // ETA pills
          let etasHtml = "";
          if (validEtas.length > 0) {
            const displayList = validEtas.slice(0, showCount);
            etasHtml = displayList.map(etaItem => {
              const diffMinutes = Math.round((etaItem.ts - now) / 60000);
              let label = `${diffMinutes} ${t('min', lang)}`;

              if (diffMinutes <= 0) {
                label = t("arriving", lang);
                colorClass = "text-emerald-600 dark:text-emerald-400 font-bold";
              } else if (diffMinutes <= 3) {
                colorClass = "text-emerald-600 dark:text-emerald-400 font-semibold";
              }

              const timeStr = formatHKTime(new Date(etaItem.ts));

              return `
                <div class="flex flex-col items-end leading-tight tabular-nums">
                  <span class="text-[12.5px] font-semibold ${colorClass}">${label}</span>
                  <span class="text-[9.5px] text-muted-foreground">${timeStr}</span>
                </div>
              `;
            }).join(`<span class="text-muted-foreground/40 self-center text-xs">|</span>`);
          } else {
            const fallbackRmk = matching[0] ? (lang === "en" ? (matching[0].rmk_en || matching[0].rmk_tc) : matching[0].rmk_tc) : "";
            etasHtml = `<span class="text-[11px] text-muted-foreground font-medium">${fallbackRmk || t("noService", lang)}</span>`;
          }

          return `
            <div class="h-[34px] flex items-center justify-between py-1 border-b border-border/30 last:border-0 gap-2">
              <div class="flex items-center gap-1.5 min-w-0 flex-1">

            </div>

    function loadSunCard() {
      const lang = currentSettings.lang;
      const bodyEl = document.getElementById("body-sun");
      if (!bodyEl) return;

      const now = new Date();
      const sunData = computeSunHK(now);
      
      let displaySunrise = sunData.today.sunrise;
      let displaySunset = sunData.today.sunset;
      let isTomorrow = false;

      if (now.getTime() > displaySunset.getTime()) {
        displaySunrise = sunData.tomorrow.sunrise;
        displaySunset = sunData.tomorrow.sunset;
        isTomorrow = true;
      }

      const sunriseStr = formatHKTime(displaySunrise);
      const sunsetStr = formatHKTime(displaySunset);

      // Daylight duration calculation
      const dayLenMin = sunData.today.dayLengthMin;
      const hours = Math.floor(dayLenMin / 60);
      const mins = dayLenMin % 60;

      // Progress bar (2% to 98%)
      const todaySunriseMs = sunData.today.sunrise.getTime();
      const todaySunsetMs = sunData.today.sunset.getTime();
      const nowMs = now.getTime();
      let pct = 2;
      let isDay = false;

      if (nowMs < todaySunriseMs) {
        pct = 2;
        isDay = false;
      } else if (nowMs > todaySunsetMs) {
        pct = 98;
        isDay = false;
      } else {
        isDay = true;
        pct = 2 + Math.round(((nowMs - todaySunriseMs) / (todaySunsetMs - todaySunriseMs)) * 96);
      }

      bodyEl.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <!-- Sunrise Tile -->
          <div class="p-2 rounded-xl bg-muted/50 border border-border/50 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-muted-foreground flex items-center gap-1">🌅 ${t("sunrise", lang)}</span>
              ${isTomorrow ? `<span class="text-[9px] font-bold px-1 rounded bg-primary/20 text-primary">+1</span>` : ""}
            </div>
            <span class="text-lg font-bold text-foreground tabular-nums mt-1">${sunriseStr}</span>
          </div>

          <!-- Sunset Tile -->
          <div class="p-2 rounded-xl bg-muted/50 border border-border/50 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-muted-foreground flex items-center gap-1">🌇 ${t("sunset", lang)}</span>
              ${isTomorrow ? `<span class="text-[9px] font-bold px-1 rounded bg-primary/20 text-primary">+1</span>` : ""}
            </div>
            <span class="text-lg font-bold text-foreground tabular-nums mt-1">${sunsetStr}</span>
          </div>
        </div>

        <!-- Daylight length row -->
        <div class="flex items-center justify-between text-xs py-1 border-t border-border/30 mt-1 tabular-nums">
          <span class="text-muted-foreground text-[11px]">${t("daylight", lang)}</span>
          <div class="flex items-center gap-1.5 font-semibold text-foreground">
            <span>${hours}h ${mins}m</span>
            <span class="text-[10px] px-1 rounded ${isDay ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'bg-slate-500/10 text-slate-500'}">
              ${isDay ? t("daytime", lang) : t("nighttime", lang)}
            </span>
          </div>
        </div>

        <!-- Solar progress bar -->
        <div class="relative w-full h-1.5 rounded-full bg-gradient-to-r from-amber-400/60 via-amber-300 to-slate-500/40 mt-1">
          <div class="absolute -top-[3px] w-2.5 h-2.5 rounded-full bg-foreground border-2 border-background shadow" style="left: ${pct}%; transform: translateX(-50%);"></div>
        </div>
      `;
    }

    function renderSparklineSvg(points, isUp) {
      if (!points || points.length < 2) return "";
      
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = (max - min) || (max * 0.01) || 1;
      const padding = range * 0.1;
      const adjMin = min - padding;
      const adjMax = max + padding;
      const adjRange = adjMax - adjMin;

      const w = 100;
      const h = 34;
      const coords = points.map((val, idx) => {
        const x = (idx / (points.length - 1)) * w;
        const y = h - ((val - adjMin) / adjRange) * h;
        return [x, y];
      });

      const pathData = coords.reduce((acc, [x, y], idx) => {

    function monthsInWindow(days) {
      const out = [];
      const seen = new Set();
      const pad = n => String(n).padStart(2, '0');
      for (let i = -1; i <= days + 1; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const key = `${d.getFullYear()}${pad(d.getMonth() + 1)}`;
        if (!seen.has(key)) {
          seen.add(key);
          out.push(key);
        }
      }
      return out;
    }

    function parseEspnEvent(ev, leagueInfo) {
      const comp = (ev.competitions && ev.competitions[0]) || {};
      const status = comp.status || ev.status || {};
      const type = status.type || {};
      const competitors = comp.competitors || ev.competitors || [];

      const pickComp = (c) => {
        const team = c.team || {};
        return {
          name: team.displayName || team.name || c.displayName || c.shortDisplayName || "TBC",
          short: c.abbreviation || team.abbreviation || "",
          logo: c.logo || team.logo || "",
          color: team.color || c.color || "",
          score: c.score !== undefined ? String(c.score) : "",
          winner: !!c.winner,
          homeAway: c.homeAway || (c.order === 0 ? "home" : "away")
        };
      };

      const homeComp = pickComp(competitors.find(c => c.homeAway === "home") || competitors[0] || {});
      const awayComp = pickComp(competitors.find(c => c.homeAway === "away") || competitors[1] || {});

      const rawKickoff = comp.date || comp.startDate || ev.date;
      const kickoff = new Date(rawKickoff);
      const venue = comp.venue || ev.venue || {};
      const venueName = venue.fullName || "";
      const venueCity = (venue.address && [venue.address.city, venue.address.country].filter(Boolean).join(", ")) || "";

      const tvList = []
        .concat((comp.broadcasts || []).flatMap(b => b.names || []))
        .concat((comp.geoBroadcasts || []).map(g => g.media && g.media.shortName).filter(Boolean));
      const tv = [...new Set(tvList)].join(" · ");

      const sumLink = (ev.links && ev.links.find(l => (l.rel || []).includes("summary")))?.href || "https://www.espn.com/soccer/scoreboard";

      return {
        id: ev.id || `${leagueInfo.slug}_${kickoff.getTime()}_${Math.random()}`,
        slug: leagueInfo.slug,
        league: leagueInfo,
        kickoff,
        state: type.state || "pre", // 'pre' | 'in' | 'post'
        label: type.shortDetail || type.description || "",
        detail: type.detail || "",
        clock: status.displayClock || "",
        descr: type.description || "",
        home: homeComp,
        away: awayComp,
        venue: venueName,
        city: venueCity,
        tv,
        link: sumLink
      };
    }

    async function fetchEspnLeagueScoreboard(slug) {
      const leagueInfo = LEAGUE_BY_SLUG[slug] || { slug, zh: slug, en: slug, color: "#64748b" };
      const months = monthsInWindow(7);

      const tryFetch = async (url) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 9000);
        try {
          const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.events) return data.events;
          }
        } catch (e) {
          // Attempt through CORS proxy if direct fetch is blocked
          try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const pRes = await fetch(proxyUrl, { signal: ctrl.signal });
            if (pRes.ok) {
              const pData = await pRes.json();
              if (pData && pData.events) return pData.events;
            }
          } catch (pe) {}
        } finally {
          clearTimeout(timer);
        }
        return null;
      };

      try {
        const monthFetches = months.map(m => tryFetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${slug}/scoreboard?dates=${m}&limit=200`));
        const results = await Promise.all(monthFetches);
        let events = [];
        results.forEach(r => {
          if (Array.isArray(r)) events.push(...r);
        });

        // If no events for the specific month (e.g. date shift), fetch current active matchday
        if (events.length === 0) {
          const fallbackEvents = await tryFetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${slug}/scoreboard?limit=100`);
          if (Array.isArray(fallbackEvents)) events = fallbackEvents;
        }

        return events.map(ev => parseEspnEvent(ev, leagueInfo));
      } catch (err) {
        console.warn(`Error fetching ESPN scoreboard for ${slug}:`, err);
        return [];
      }
    }

    function getFallbackFixtures(leagueCode, baseDate = new Date()) {
      const msDay = 86400000;
      const t = baseDate.getTime();
      const roundTime = (offsetDays, hour, min) => {
        const d = new Date(t + offsetDays * msDay);
        d.setHours(hour, min, 0, 0);
        return d;
      };

      const mk = (slug, h, a, hs, as, offset, hour, min, state, clock) => {
        const lg = LEAGUE_BY_SLUG[slug] || { slug, zh: slug, en: slug, color: "#64748b" };

          detail: state === "in" ? `${clock} 進行中` : "Scheduled",
          clock: clock || "",
          descr: state === "in" ? "In Progress" : "Scheduled",

          venue: "Stamford Bridge",
          city: "London",
          tv: "Now Sports · ESPN+",
          link: "https://www.espn.com/soccer/scoreboard"
        };
      };

      const demos = [
        mk("eng.1", "Brentford", "Chelsea", "1", "1", 0, 19, 30, "in", "67'"),
        mk("eng.1", "Manchester City", "Liverpool", "", "", 0, 22, 0, "pre", ""),
        mk("esp.1", "Real Madrid", "Barcelona", "", "", 1, 20, 0, "pre", ""),
        mk("eng.1", "Tottenham Hotspur", "Aston Villa", "", "", 1, 22, 30, "pre", ""),
        mk("ita.1", "Inter Milan", "Juventus", "", "", 2, 0, 0, "pre", ""),
        mk("ger.1", "Bayern Munich", "Borussia Dortmund", "", "", 2, 21, 30, "pre", ""),
        mk("fra.1", "Paris Saint-Germain", "Marseille", "", "", 3, 2, 45, "pre", ""),
        mk("uefa.champions", "Arsenal", "Real Madrid", "", "", 4, 3, 0, "pre", ""),
        mk("uefa.europa", "Tottenham Hotspur", "Roma", "", "", 5, 3, 0, "pre", ""),
        mk("eng.2", "Leeds United", "Sunderland", "", "", 6, 20, 0, "pre", "")
      ];

      if (leagueCode === "all") return demos;
      const filtered = demos.filter(d => d.slug === leagueCode);
      return filtered.length > 0 ? filtered : demos.slice(0, 3);
    }

    function filterMatchesInSevenDays(matches) {
      if (!matches || matches.length === 0) return [];
      const now = Date.now();
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      const end = new Date(start.getTime() + 8 * 86400000); // 7 full days ahead

      let filtered = matches.filter(m => {
        if (m.state === "in") return true; // Live always kept
        if (m.state === "post") {
          return (now - m.kickoff.getTime()) < 3 * 3600000; // Finished within 3 hours
        }
        return m.kickoff >= start && m.kickoff < end;
      });

      // Adaptive window: if device year/date does not overlap with live ESPN matches, anchor 7-day window to matches
      if (filtered.length === 0 && matches.length > 0) {
        const sorted = [...matches].sort((a, b) => a.kickoff.getTime() - b.kickoff.getTime());
        const pivot = sorted[0].kickoff.getTime();
        const pivotStart = new Date(pivot);
        pivotStart.setHours(0, 0, 0, 0);
        const pivotEnd = new Date(pivotStart.getTime() + 8 * 86400000);

        filtered = matches.filter(m => {
          if (m.state === "in") return true;
          return m.kickoff >= pivotStart && m.kickoff < pivotEnd;
        });
      }

      return filtered.sort((a, b) => {
        if (a.state === "in" && b.state !== "in") return -1;
        if (b.state === "in" && a.state !== "in") return 1;
        return a.kickoff.getTime() - b.kickoff.getTime();
      });
    }

    function relMatchCountdown(kickoffMs, lang = "tc") {
      const now = Date.now();
      const diff = kickoffMs - now;
      if (diff <= 0) return lang === "en" ? "Starting" : "即將開賽";
      const mins = Math.round(diff / 60000);
      if (mins < 60) return `${mins} ${lang === "en" ? "min" : "分鐘後"}`;
      const h = Math.floor(mins / 60), m = mins % 60;
      if (h < 24) return m ? `${h}h ${m}m` : `${h} ${lang === "en" ? "h" : "小時後"}`;
      const d = Math.floor(h / 24);
      return `${d} ${lang === "en" ? "d" : "天後"}`;
    }

        const startDate = new Date();

        nowZero.setHours(0, 0, 0, 0);

        const groups = {};
        upcomingMatches.forEach(match => {
          const mDate = new Date(match.kickoff);
          const matchDayZero = new Date(mDate);
          matchDayZero.setHours(0, 0, 0, 0);
          const diffDays = Math.round((matchDayZero.getTime() - nowZero.getTime()) / 86400000);

          let dayLabelStr = "";
          if (diffDays === 0) dayLabelStr = lang === "en" ? "Today" : "今天";

          const dateNumStr = `${mDate.getMonth() + 1}/${mDate.getDate()}`;
          const groupTitle = `${dayLabelStr} · ${dateNumStr}`;

        loader: loadAiNewsCard
      },
      govnews: {

        getTitle: (l) => t("govnewsTitle", l),
        source: "info.gov.hk",
        loader: loadGovNewsCard
      },
      fx: {
        spanSm: "sm:col-span-1",
        spanLg: "lg:col-span-4",
        icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>`,
        getTitle: (l) => t("fxTitle", l),
        source: "ER-API",
        loader: loadForexCard
      },
      markets: {
        spanSm: "sm:col-span-2",
        spanLg: "lg:col-span-12",
        icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>`,
        getTitle: (l) => t("marketsTitle", l),
        source: (l) => t("marketsTenDays", l),
        loader: loadMarketsCard
      },
      football: {
        spanSm: "sm:col-span-2",
        spanLg: "lg:col-span-12",
        icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>`,
        getTitle: (l) => {
          return `
            <a href="https://m.footylogic.com/zh" target="_blank" class="hover:underline text-foreground" title="賽程網站 / Fixtures site">${t('footballTitle', l)}</a>
            <span class="text-[10.5px] font-normal text-muted-foreground ml-1.5 hidden sm:inline">直播 + 未來 7 天</span>
          `;
        },
        headerEnd: `
          <select id="football-league-filter" onchange="onFootballLeagueChange(this.value)" class="h-6 text-[10.5px] px-1 py-0 bg-muted/70 hover:bg-muted border border-border/80 rounded-md text-foreground outline-none cursor-pointer">
            <option value="all">全部 · Show All</option>
            <option value="eng.1">英超 · Premier League</option>
            <option value="eng.2">英冠 · Championship</option>
            <option value="esp.1">西甲 · La Liga</option>
            <option value="ita.1">意甲 · Serie A</option>
            <option value="ger.1">德甲 · Bundesliga</option>
            <option value="fra.1">法甲 · Ligue 1</option>

          </select>
        `,
        source: "ESPN Site API",
        loader: loadFootballCard
      },
      word: {
        spanSm: "sm:col-span-2",
        spanLg: "lg:col-span-12",
        icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>`,
        getTitle: (l) => t("wordTitle", l),
        source: "Cambridge Dictionary",
        loader: renderDailyWordCard
      }
    };

    function renderAllCards() {
      const grid = document.getElementById("cards-grid");
      if (!grid) return;

      const lang = currentSettings.lang;
      let html = "";

      currentSettings.order.forEach(cardId => {
        if (currentSettings.hidden.includes(cardId)) return;
        const meta = CARD_METADATA[cardId];
        if (!meta) return;

        let headerExtra = "";
        if (meta.isBus) {
          const cfg = currentSettings.bus[cardId];
          if (cfg && cfg.routes) {
            headerExtra = `
              <div class="flex items-center gap-1 shrink-0 ml-1">
                ${cfg.routes.slice(0, 3).map(r => `
                  <span class="text-[9px] font-semibold px-1 py-0.5 rounded bg-muted text-muted-foreground">${r}</span>
                `).join("")}
              </div>
            `;
          }
        }

        const onGearCall = meta.isBus ? `openSettingsForBus('${cardId}')` : null;
        const sourceNoteStr = typeof meta.source === "function" ? meta.source(lang) : (meta.source || "");

        html += `
          <div class="col-span-1 ${meta.spanSm} ${meta.spanLg} flex flex-col h-full">
            ${createCardFrame({
              id: cardId,
              title: typeof meta.getTitle === "function" ? meta.getTitle(lang) : meta.getTitle,
              iconSvg: meta.icon,
              headerExtra: headerExtra,
              headerEnd: meta.headerEnd || "",
              onGear: onGearCall,
              autoNote: meta.autoNote,
              sourceNote: sourceNoteStr
            })}
          </div>
        `;
      });

      grid.innerHTML = html;

      // Trigger asynchronous data loaders
      currentSettings.order.forEach(cardId => {
        if (!currentSettings.hidden.includes(cardId)) {
          const meta = CARD_METADATA[cardId];
          if (meta && typeof meta.loader === "function") {
            meta.loader();
          }
        }
      });
    }

    function refreshSingleCard(cardId) {
      const icon = document.getElementById(`refresh-icon-${cardId}`);
      if (icon) icon.classList.add("spin-active");
      
      const meta = CARD_METADATA[cardId];
      if (meta && typeof meta.loader === "function") {
        Promise.resolve(meta.loader(true)).finally(() => {
          setTimeout(() => {
            if (icon) icon.classList.remove("spin-active");
            const updatedEl = document.getElementById(`card-updated-${cardId}`);
            if (updatedEl) {
              updatedEl.textContent = `${t("updatedAt", currentSettings.lang)} ${formatHKTime(new Date())}`;
            }
          }, 800);
        });
      }
    }

    function updateAllCards() {
      const icon = document.getElementById("icon-update-all");
      if (icon) icon.classList.add("spin-active");

      const promises = currentSettings.order.map(cardId => {
        if (!currentSettings.hidden.includes(cardId)) {
          const meta = CARD_METADATA[cardId];
          if (meta && typeof meta.loader === "function") {
            return Promise.resolve(meta.loader(true));
          }
        }
        return Promise.resolve();
      });

      Promise.all(promises).finally(() => {
        setTimeout(() => {
          if (icon) icon.classList.remove("spin-active");
        }, 1200);
      });
    }

    function populateSettingsModal() {
      const lang = currentSettings.lang;
      
      // Update modal text labels
      document.getElementById("settings-title").innerHTML = `
        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        ${lang === "en" ? "Dashboard Settings" : "儀表板設定"}
      `;
      document.getElementById("lbl-setting-lang").textContent = lang === "en" ? "Interface Language" : "介面語言";
      document.getElementById("lbl-setting-cards").textContent = lang === "en" ? "Cards & Order" : "卡片顯示及排序";
      document.getElementById("lbl-setting-bus").textContent = lang === "en" ? "Bus Cards Setup" : "巴士卡設定";
      document.getElementById("lbl-setting-league").textContent = lang === "en" ? "Football League" : "足球聯賽";
      document.getElementById("txt-reset-all").textContent = lang === "en" ? "Reset all settings" : "重設全部設定";

      // 1. Language buttons
      document.querySelectorAll(".lang-opt-btn").forEach(btn => {
        const opt = btn.getAttribute("data-lang");
        if (opt === lang) {
          btn.className = "lang-opt-btn py-1.5 font-medium rounded-lg text-center transition-all bg-card text-foreground shadow-sm";
        } else {
          btn.className = "lang-opt-btn py-1.5 font-medium rounded-lg text-center transition-all text-muted-foreground hover:text-foreground";
        }
      });

      // 2. Card Ordering and Visibility rows
      const cardsListEl = document.getElementById("settings-cards-list");
      cardsListEl.innerHTML = currentSettings.order.map((cardId, index) => {
        const meta = CARD_METADATA[cardId];
        const isHidden = currentSettings.hidden.includes(cardId);
        const cardTitle = typeof meta.getTitle === "function" ? meta.getTitle(lang) : meta.getTitle;
        // strip HTML tags for clean label
        const plainTitle = cardTitle.replace(/<[^>]*>?/gm, "").trim();

        return `
          <div class="flex items-center justify-between p-1.5 rounded-lg border border-border/40 bg-card text-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-4 text-center font-semibold text-muted-foreground text-[10px] tabular-nums">${index + 1}</span>
              <span class="font-medium text-foreground truncate">${plainTitle}</span>
            </div>
            
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="moveCardOrder(${index}, -1)" ${index === 0 ? 'disabled class="opacity-20"' : 'class="p-1 rounded hover:bg-muted text-foreground"'} title="向上移 / Move up">↑</button>
              <button onclick="moveCardOrder(${index}, 1)" ${index === currentSettings.order.length - 1 ? 'disabled class="opacity-20"' : 'class="p-1 rounded hover:bg-muted text-foreground"'} title="向下移 / Move down">↓</button>
              <button onclick="toggleCardVisibility('${cardId}')" class="px-2 py-0.5 text-[10px] font-semibold rounded-md border ${isHidden ? 'bg-muted text-muted-foreground border-border' : 'bg-primary/10 text-primary border-primary/30'}">
                ${isHidden ? (lang === 'en' ? 'Hidden' : '隱藏') : (lang === 'en' ? 'Visible' : '顯示')}
              </button>
            </div>
          </div>
        `;
      }).join("");

      // 3. Bus Slot Editors
      const busContainer = document.getElementById("bus-cards-editors");
      const busSlots = ["busCustom1", "busCustom2", "busCustom3", "busCustom4", "busCustom5", "busFortune", "busTMR", "busKlnBay"];
      
      busContainer.innerHTML = busSlots.map(slot => {
        const conf = currentSettings.bus[slot];
        const plainSlotName = CARD_METADATA[slot].getTitle(lang).replace(/<[^>]*>?/gm, "").trim();
        const routesStr = conf.routes.join(", ");

        const stopsHtml = conf.stops.map(s => `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-muted text-foreground border border-border/60" title="${s.id}">
            <span>${s.label}</span>
            <button type="button" onclick="removeStopFromBusSlot('${slot}', '${s.id}')" class="text-muted-foreground hover:text-destructive text-[11px] leading-none">×</button>
          </span>
        `).join("");

        return `
          <div id="bus-editor-${slot}" class="p-2.5 rounded-xl border border-border/70 bg-card space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-semibold text-foreground text-xs">${plainSlotName}</span>
              <div class="flex items-center gap-1">
                <span class="text-[10px] text-muted-foreground">顯示班次:</span>
                <select onchange="updateBusShowCount('${slot}', this.value)" class="bg-background border border-border text-foreground rounded text-[11px] px-1 py-0.5 outline-none">
                  <option value="1" ${conf.showCount === 1 ? 'selected' : ''}>1</option>
                  <option value="2" ${conf.showCount === 2 ? 'selected' : ''}>2</option>
                  <option value="3" ${conf.showCount === 3 ? 'selected' : ''}>3</option>
                </select>
              </div>
            </div>

            <!-- Route Input -->
            <div class="flex items-center gap-1.5">
              <input type="text" id="input-routes-${slot}" value="${routesStr}" placeholder="60M, 60X, 61X..." class="flex-1 bg-background border border-border text-foreground rounded-lg px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-primary" onkeydown="if(event.key==='Enter') commitBusRoutes('${slot}')" onblur="commitBusRoutes('${slot}')"/>
              <button onclick="commitBusRoutes('${slot}')" class="px-2 py-1 bg-primary text-white font-medium rounded-lg text-xs hover:bg-primary/90">確定</button>
            </div>

            <!-- Stop Search Input -->
            <div class="relative">
              <input type="text" id="search-stop-${slot}" placeholder="搜尋九巴站名添加（例如：屯門、紅磡...）" class="w-full bg-background border border-border text-foreground rounded-lg px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-primary" oninput="handleStopSearchInput('${slot}', this.value)"/>
              <div id="dropdown-stop-${slot}" class="absolute left-0 right-0 top-full mt-1 bg-popover border border-border rounded-lg shadow-xl z-20 hidden max-h-36 overflow-y-auto thin-scroll"></div>
            </div>

            <!-- Selected Stops Chips -->
            <div class="flex flex-wrap gap-1 pt-0.5">
              ${stopsHtml}
            </div>
          </div>
        `;
      }).join("");

      // 4. League selector
      const leagueSelect = document.getElementById("settings-league-select");
      if (leagueSelect) leagueSelect.value = currentSettings.league || "all";
    }

    function moveCardOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= currentSettings.order.length) return;
      const tmp = currentSettings.order[index];
      currentSettings.order[index] = currentSettings.order[target];
      currentSettings.order[target] = tmp;
      saveSettings(currentSettings);
      populateSettingsModal();
      renderAllCards();
    }

    function toggleCardVisibility(cardId) {
      if (currentSettings.hidden.includes(cardId)) {
        currentSettings.hidden = currentSettings.hidden.filter(id => id !== cardId);
      } else {
        currentSettings.hidden.push(cardId);
      }
      saveSettings(currentSettings);
      populateSettingsModal();
      renderAllCards();
    }

    function updateBusShowCount(slot, val) {
      const num = parseInt(val, 10);
      if ([1, 2, 3].includes(num)) {
        currentSettings.bus[slot].showCount = num;
        saveSettings(currentSettings);
        loadBusCard(slot);
      }
    }

    function commitBusRoutes(slot) {
      const input = document.getElementById(`input-routes-${slot}`);
      if (!input) return;
      const raw = input.value;
      const split = raw.split(/[，,、\s]+/).filter(Boolean).map(r => r.toUpperCase());
      const dedupe = [...new Set(split)].slice(0, 12);
      currentSettings.bus[slot].routes = dedupe;
      saveSettings(currentSettings);
      loadBusCard(slot);
    }

    function removeStopFromBusSlot(slot, stopId) {
      currentSettings.bus[slot].stops = currentSettings.bus[slot].stops.filter(s => s.id !== stopId);
      saveSettings(currentSettings);
      populateSettingsModal();
      loadBusCard(slot);
    }

    async function handleStopSearchInput(slot, query) {
      const dropdown = document.getElementById(`dropdown-stop-${slot}`);
      if (!dropdown) return;
      if (!query || query.trim().length === 0) {
        dropdown.classList.add("hidden");
        return;
      }

      clearTimeout(stopSearchDebounceTimer);
      stopSearchDebounceTimer = setTimeout(async () => {
        try {
          if (!cachedKmbStops) {
            const res = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/stop");
            const json = await res.json();
            cachedKmbStops = json.data || [];
          }

          const q = query.toLowerCase().trim();
          const hits = cachedKmbStops.filter(s => {
            const nameTc = (s.name_tc || "").toLowerCase();
            const nameEn = (s.name_en || "").toLowerCase();
            return nameTc.includes(q) || nameEn.includes(q);
          }).slice(0, 12);

          if (hits.length === 0) {
            dropdown.innerHTML = `<div class="p-2 text-muted-foreground text-center">找不到相符車站</div>`;
            dropdown.classList.remove("hidden");
            return;
          }

          dropdown.innerHTML = hits.map(hit => {
            const cleanLabel = (hit.name_tc || "").split("(")[0].split("（")[0].trim() || hit.name_en;
            return `
              <div onclick="addStopToBusSlot('${slot}', '${hit.stop}', '${cleanLabel.replace(/'/g, "\\'")}')" class="p-2 hover:bg-muted cursor-pointer flex items-center justify-between border-b border-border/40 last:border-0">
                <span class="text-foreground font-medium">${hit.name_tc} <span class="text-muted-foreground text-[10px]">(${hit.name_en})</span></span>
                <span class="text-[9px] text-muted-foreground tabular-nums">${hit.stop.slice(0, 6)}...</span>
              </div>
            `;
          }).join("");

          dropdown.classList.remove("hidden");
        } catch(e) {
          dropdown.classList.add("hidden");
        }
      }, 350);
    }

    function addStopToBusSlot(slot, stopId, label) {
      const conf = currentSettings.bus[slot];
      if (conf.stops.length >= 6) {
        return;
      }
      if (conf.stops.some(s => s.id === stopId)) {
        return;
      }
      conf.stops.push({ id: stopId, label: label });
      saveSettings(currentSettings);
      
      const dropdown = document.getElementById(`dropdown-stop-${slot}`);
      if (dropdown) dropdown.classList.add("hidden");
      const searchInput = document.getElementById(`search-stop-${slot}`);
      if (searchInput) searchInput.value = "";

      populateSettingsModal();
      loadBusCard(slot);
    }

    function openSettingsForBus(slot) {
      populateSettingsModal();
      const modal = document.getElementById("settings-dialog");
      if (modal) modal.classList.remove("hidden");
      
      setTimeout(() => {
        const el = document.getElementById(`bus-editor-${slot}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 100);
    }

    window.addEventListener("DOMContentLoaded", () => {
      // 1. Load settings and setup clock
      currentSettings = loadSettings();
      startClockTicker();
      setupRefreshTimers();

      // Update lang text badge
      const langBadge = document.getElementById("txt-lang-badge");
      if (langBadge) langBadge.textContent = currentSettings.lang === "en" ? "中" : "EN";

      // 2. Hide initial skeleton and show real cards grid
      setTimeout(() => {
        const skeleton = document.getElementById("skeleton-grid");
        const grid = document.getElementById("cards-grid");
        if (skeleton) skeleton.classList.add("hidden");
        if (grid) grid.classList.remove("hidden");
        renderAllCards();
      }, 50);

      // 3. Header Action Buttons
      document.getElementById("btn-update-all")?.addEventListener("click", updateAllCards);

      document.getElementById("btn-lang")?.addEventListener("click", () => {
        currentSettings.lang = currentSettings.lang === "tc" ? "en" : "tc";
        saveSettings(currentSettings);
        if (langBadge) langBadge.textContent = currentSettings.lang === "en" ? "中" : "EN";
        const updateAllTxt = document.getElementById("txt-update-all");
        if (updateAllTxt) updateAllTxt.textContent = t("updateAll", currentSettings.lang);
        document.getElementById("hk-date").textContent = formatHKDate(new Date(), currentSettings.lang);
        renderAllCards();
      });

      document.getElementById("btn-palette")?.addEventListener("click", () => {
        const currentAccent = document.documentElement.getAttribute("data-accent");
        const next = currentAccent === "purple" ? "default" : "purple";
        if (next === "purple") {
          document.documentElement.setAttribute("data-accent", "purple");
          localStorage.setItem("hk-dashboard-accent", "purple");
        } else {
          document.documentElement.removeAttribute("data-accent");
          localStorage.setItem("hk-dashboard-accent", "default");
        }
      });

      document.getElementById("btn-theme")?.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("hk-dashboard-theme", isDark ? "dark" : "light");
      });

      document.getElementById("btn-settings")?.addEventListener("click", () => {
        populateSettingsModal();
        document.getElementById("settings-dialog")?.classList.remove("hidden");
      });

      document.getElementById("btn-close-settings")?.addEventListener("click", () => {
        document.getElementById("settings-dialog")?.classList.add("hidden");
      });

      // Close dropdowns on outside click
      document.addEventListener("mousedown", (e) => {
        const modal = document.getElementById("settings-dialog");
        if (modal && e.target === modal) {
          modal.classList.add("hidden");
        }
        document.querySelectorAll("[id^='dropdown-stop-']").forEach(dd => {
          if (!dd.contains(e.target) && !e.target.closest("input")) {
            dd.classList.add("hidden");
          }
        });
      });

      // Settings Modal Language Switch
      document.querySelectorAll(".lang-opt-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const l = btn.getAttribute("data-lang");
          if (l && l !== currentSettings.lang) {
            currentSettings.lang = l;
            saveSettings(currentSettings);
            if (langBadge) langBadge.textContent = currentSettings.lang === "en" ? "中" : "EN";
            populateSettingsModal();
            renderAllCards();
          }
        });
      });

      // Football League selection change
      document.getElementById("settings-league-select")?.addEventListener("change", (e) => {
        currentSettings.league = e.target.value;
        saveSettings(currentSettings);
        const inCardSelect = document.getElementById("football-league-filter");
        if (inCardSelect) inCardSelect.value = e.target.value;
        loadFootballCard(true);
      });

      // Custom Confirmation Reset Dialog
      document.getElementById("btn-open-reset-confirm")?.addEventListener("click", () => {
        document.getElementById("confirm-dialog")?.classList.remove("hidden");
      });

      document.getElementById("btn-confirm-cancel")?.addEventListener("click", () => {
        document.getElementById("confirm-dialog")?.classList.add("hidden");
      });

      document.getElementById("btn-confirm-ok")?.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY_V14);
        currentSettings = getDefaultSettings();
        saveSettings(currentSettings);
        document.getElementById("confirm-dialog")?.classList.add("hidden");
        document.getElementById("settings-dialog")?.classList.add("hidden");
        renderAllCards();
      });
    });
  </script>
</body>
</html>
