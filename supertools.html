    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass-nav { backdrop-filter: blur(12px); background: rgba(249, 247, 242, 0.9); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* Touch hit target optimization */
        .touch-target { min-height: 44px; min-width: 44px; }
    </style>
</head>

        const IconGrid = () => (

        );

          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

        );

        );

        );
        const IconDownload = () => (

        );
        const IconReset = () => (

        );

          <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        );
        const IconGlobe = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        );
        const IconCalc = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01M12 10h.01M8 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/></svg>
        );
        const IconTrend = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const IconPlus = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        );
        const IconTrash = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', icon: Icon, disabled = false }) => {
          const variants = {
            primary: 'bg-[#7C8363] text-white hover:bg-[#6A7055] active:bg-[#585D46]',
            secondary: 'bg-[#D4A373] text-white hover:bg-[#C29262] active:bg-[#AF8053]',
            outline: 'border-2 border-[#7C8363] text-[#7C8363] hover:bg-[#7C8363] hover:text-white',
            ghost: 'text-[#8C8C8C] hover:text-[#4A4A4A] active:bg-gray-100/60',
          };
          return (
            <button
              onClick={onClick}
              disabled={disabled}
              className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-200 font-medium active:scale-95 disabled:opacity-50 disabled:pointer-events-none touch-target ${variants[variant]} ${className}`}
            >
              {Icon && <Icon />}
              {children}
            </button>
          );
        };

        const Card = ({ children, onClick, className = "" }) => (
          <div onClick={onClick} className={`bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5E5] hover:shadow-md active:bg-[#FAF9F5] transition-all cursor-pointer ${className}`}>
            {children}
          </div>
        );

        const UrlPurifier = ({ t }) => {
          const [input, setInput] = useState('');
          const [output, setOutput] = useState('');
          const [copied, setCopied] = useState(false);

          const purifyUrls = () => {
            const lines = input.split('\n').filter(line => line.trim() !== '');
            const results = lines.map(line => {
              try {
                let urlStr = line.trim();
                const match = urlStr.match(/(https?:\/\/[^\s]+)/);
                if (!match) return line;
                
                let url = new URL(match[0]);
                const trackers = [
                  'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 
                  'fbclid', 'gclid', 'msclkid', '_ga', 'ref', 'spm', 'st_source', 'st_medium',
                  'share_id', 'nw_id'
                ];
                trackers.forEach(param => url.searchParams.delete(param));

                const pathParts = url.pathname.split('/');
                const idIndex = pathParts.findIndex(part => /^\d{5,}$/.test(part));
                if (idIndex !== -1) {
                  url.pathname = pathParts.slice(0, idIndex + 1).join('/');
                }

                let finalUrl = url.toString();
                if (!url.search && !url.hash && finalUrl.endsWith('/')) {
                    finalUrl = finalUrl.slice(0, -1);
                }
                return decodeURIComponent(finalUrl);
              } catch (e) {
                return line;
              }
            });
            setOutput(results.join('\n'));
          };

          const copyToClipboard = () => {
            const textArea = document.createElement("textarea");
            textArea.value = output;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          };

          return (
            <div className="space-y-5">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-xs font-bold uppercase tracking-wider opacity-50">{t.purifier.label}</label>
                  {input && (
                    <button onClick={() => { setInput(''); setOutput(''); }} className="text-xs text-rose-500 font-medium hover:underline p-1">
                      {t.purifier.clear}
                    </button>
                  )}
                </div>
                <textarea
                  className="w-full h-36 p-4 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none transition-all text-sm bg-white"
                  placeholder={t.purifier.placeholder}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  inputMode="url"
                />
                <Button onClick={purifyUrls} className="w-full mt-3 shadow-sm py-3" variant="primary" icon={IconShield}>
                  {t.purifier.btn}
                </Button>
              </div>

              {output && (
                <div className="space-y-3 animate-fade-in">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-sm">{t.purifier.results}</h3>
                    <Button variant="ghost" onClick={copyToClipboard} icon={copied ? IconCheck : IconCopy} className="text-xs py-1">
                      {copied ? t.purifier.copied : t.purifier.copyAll}
                    </Button>
                  </div>
                  <pre className="w-full p-4 bg-[#FDFCFB] rounded-xl border border-[#F0EBE3] font-mono text-xs overflow-x-auto whitespace-pre-wrap break-all leading-relaxed text-[#7C8363]">
                    {output}
                  </pre>
                </div>
              )}
            </div>
          );
        };

        const LinkExtractor = ({ t }) => {
          const [input, setInput] = useState('');
          const [output, setOutput] = useState('');
          const extractLinks = () => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const matches = input.match(urlRegex) || [];
            const cleanLinks = matches.map(url => url.replace(/[.,;]$/, ''));
            if (cleanLinks.length > 0) {
              setOutput(cleanLinks.join('\n'));
            } else {
              setOutput(t.extract.notFound);
            }
          };
          const copyToClipboard = () => {
            const textArea = document.createElement("textarea");
            textArea.value = output;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          };
          return (
            <div className="space-y-6">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider mb-2 opacity-40">{t.extract.label}</label>
                <textarea
                  className="w-full h-40 p-4 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none transition-all text-sm bg-white"
                  placeholder={t.extract.placeholder}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                />
                <Button onClick={extractLinks} className="w-full mt-4 shadow-sm" variant="primary" icon={IconSearch}>
                  {t.extract.btn}
                </Button>
              </div>
              {output && (
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-sm">{t.extract.results}</h3>
                    <Button variant="ghost" onClick={copyToClipboard} icon={IconCopy} className="text-xs">{t.extract.copyAll}</Button>
                  </div>
                  <pre className="w-full p-4 bg-[#FDFCFB] rounded-xl border border-[#F0EBE3] font-mono text-xs overflow-x-auto whitespace-pre-wrap break-all leading-relaxed">
                    {output}
                  </pre>
                </div>
              )}
            </div>
          );
        };

        const UrlShortener = ({ t }) => {
          const [input, setInput] = useState('');
          const [results, setResults] = useState([]);
          const [loading, setLoading] = useState(false);
          const shortenUrls = async () => {
            const urls = input.split('\n').filter(u => u.trim() !== '');
            if (urls.length === 0) return;
            setLoading(true);
            const newResults = [];
            for (const url of urls) {
              try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url.trim())}`);
                const shortUrl = await response.text();
                newResults.push({ original: url, short: shortUrl });
              } catch (err) {
                newResults.push({ original: url, short: 'Error' });
              }
            }
            setResults(newResults);
            setLoading(false);
          };
          const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          };
          return (
            <div className="space-y-6">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider mb-2 opacity-40">{t.shorten.label}</label>
                <textarea
                  className="w-full h-32 p-4 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none transition-all text-sm bg-white"
                  placeholder={t.shorten.placeholder}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                />
                <Button onClick={shortenUrls} className="w-full mt-4 shadow-sm" variant="primary" disabled={loading}>
                  {loading ? t.shorten.processing : t.shorten.btn}
                </Button>
              </div>
              {results.length > 0 && (
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-sm">{t.shorten.results}</h3>
                    <Button variant="ghost" onClick={() => copyToClipboard(results.map(r => r.short).join('\n'))} icon={IconCopy} className="text-xs">{t.shorten.copyAll}</Button>
                  </div>
                  {results.map((res, i) => (
                    <div key={i} className="flex items-center justify-between p-3 bg-[#FDFCFB] rounded-lg border border-[#F0EBE3]">
                      <div className="truncate flex-1 mr-4">
                        <p className="text-[10px] text-gray-400 truncate">{res.original}</p>
                        <p className="font-mono text-[#D4A373] text-sm">{res.short}</p>
                      </div>
                      <button onClick={() => copyToClipboard(res.short)} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                        <IconCopy />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        };

        const QrGenerator = ({ t }) => {
          const [input, setInput] = useState('');
          const [items, setItems] = useState([]);
          const generateQrs = () => {
            const lines = input.split('\n').filter(l => l.trim() !== '');
            setItems(lines);
          };
          const downloadQr = (url, index) => {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
            fetch(qrUrl)
              .then(res => res.blob())
              .then(blob => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `qrcode-${index + 1}.png`;
                link.click();
              });
          };
          return (
            <div className="space-y-6">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider mb-2 opacity-40">{t.qr.label}</label>
                <textarea
                  className="w-full h-32 p-4 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none transition-all text-sm bg-white"
                  placeholder={t.qr.placeholder}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                />
                <Button onClick={generateQrs} className="w-full mt-4 shadow-sm" variant="primary">{t.qr.btn}</Button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                {items.map((item, i) => (
                  <div key={i} className="p-4 bg-white rounded-xl border border-[#F0EBE3] flex flex-col items-center">
                    <img 
                      src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(item)}`} 
                      alt="QR Code"
                      className="w-full aspect-square mb-3"
                    />
                    <p className="text-[10px] text-gray-400 truncate w-full text-center mb-2">{item}</p>
                    <Button variant="ghost" onClick={() => downloadQr(item, i)} icon={IconDownload} className="w-full text-xs py-1">
                      {t.qr.download}
                    </Button>
                  </div>
                ))}
              </div>
            </div>
          );
        };

        const PriceCompare = ({ t }) => {
          const [items, setItems] = useState([
            { id: 1, name: '', price: '', qty: '' },
            { id: 2, name: '', price: '', qty: '' },
            { id: 3, name: '', price: '', qty: '' },
          ]);

          const addItem = () => {
            setItems([
              ...items,
              { id: Date.now(), name: '', price: '', qty: '' }
            ]);
          };

          const removeItem = (id) => {
            if (items.length <= 2) return;
            setItems(items.filter(item => item.id !== id));
          };

          const updateItem = (id, field, value) => {
            setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
          };

          const parsedItems = items.map((indexItem, index) => {
            const price = parseFloat(indexItem.price);
            const qty = parseFloat(indexItem.qty);
            const isValid = !isNaN(price) && !isNaN(qty) && price > 0 && qty > 0;
            const unitPrice = isValid ? price / qty : null;
            return {
              ...indexItem,
              defaultName: `${t.compare.placeholderName} ${String.fromCharCode(65 + index)}`,
              isValid,
              unitPrice
            };
          });

          const validUnitPrices = parsedItems
            .filter(i => i.isValid)
            .map(i => i.unitPrice);

          const minUnitPrice = validUnitPrices.length > 0 ? Math.min(...validUnitPrices) : null;

          return (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <p className="text-xs font-bold uppercase tracking-wider opacity-40">{t.compare.subtitle}</p>
                <Button onClick={addItem} variant="secondary" icon={IconPlus} className="text-xs py-1.5 px-3">
                  {t.compare.add}
                </Button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                {parsedItems.map((item) => {
                  const isBest = item.isValid && minUnitPrice !== null && Math.abs(item.unitPrice - minUnitPrice) < 0.00001;
                  const diffPct = item.isValid && minUnitPrice && !isBest 
                    ? (((item.unitPrice - minUnitPrice) / minUnitPrice) * 100).toFixed(1)
                    : null;

                  return (
                    <div 
                      key={item.id} 
                      className={`p-5 rounded-2xl bg-white border border-[#E5E5E5] shadow-sm transition-all hover:shadow-md active:bg-[#FAF9F5] ${
                        isBest ? 'border-[#7C8363] ring-2 ring-[#7C8363]/20 shadow-md' : ''
                      }`}
                    >
                      <div className="flex items-center justify-between mb-3">
                        <input
                          type="text"
                          placeholder={item.defaultName}
                          value={item.name}
                          onChange={(e) => updateItem(item.id, 'name', e.target.value)}
                          className="font-bold text-sm text-[#4A4A4A] bg-transparent border-b border-transparent hover:border-gray-200 focus:border-[#7C8363] outline-none transition-all w-3/4"
                        />
                        {items.length > 2 && (
                          <button 
                            onClick={() => removeItem(item.id)}
                            className="text-gray-400 hover:text-rose-500 p-1 transition-colors text-xs font-bold"
                            title={t.compare.remove}
                          >
                            ✕
                          </button>
                        )}
                      </div>

                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <div>
                          <label className="block text-[10px] font-bold uppercase tracking-wider opacity-50 mb-1">
                            {t.compare.price}
                          </label>
                          <div className="relative">
                            <span className="absolute left-2.5 top-2 text-gray-400 text-xs">$</span>
                            <input
                              type="number"
                              step="any"
                              inputMode="decimal"
                              placeholder="0"
                              value={item.price}
                              onChange={(e) => updateItem(item.id, 'price', e.target.value)}
                              className="w-full pl-6 pr-2 py-1.5 rounded-lg border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none text-xs bg-[#FDFCFB]"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-[10px] font-bold uppercase tracking-wider opacity-50 mb-1">
                            {t.compare.quantity}
                          </label>
                          <input
                            type="number"
                            step="any"
                            inputMode="decimal"
                            placeholder="1"
                            value={item.qty}
                            onChange={(e) => updateItem(item.id, 'qty', e.target.value)}
                            className="w-full px-2 py-1.5 rounded-lg border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none text-xs bg-[#FDFCFB]"
                          />
                        </div>
                      </div>

                      {item.isValid ? (
                        <div className="pt-2 border-t border-[#F0EBE3] flex items-center justify-between">
                          <div>
                            <span className="text-[9px] uppercase font-bold text-gray-400 block">{t.compare.unitPrice}</span>
                            <span className="text-base font-black text-[#4A4A4A]">
                              ${item.unitPrice.toFixed(2)}
                              <span className="text-[10px] font-normal text-gray-400 ml-0.5">/ {t.compare.perUnit}</span>
                            </span>
                          </div>

                          {isBest && (
                            <span className="inline-flex items-center gap-0.5 bg-[#7C8363] text-white text-[11px] px-2 py-0.5 rounded-full font-bold shadow-xs">
                              ✨ {t.compare.bestValue}
                            </span>
                          )}
                          {diffPct && (
                            <span className="text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                              +{diffPct}% {t.compare.pricier}
                            </span>
                          )}
                        </div>
                      ) : (
                        <div className="pt-2 border-t border-[#F0EBE3] text-[11px] text-gray-400 italic">
                          {t.compare.inputPrompt}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };

        const Pomodoro = ({ t }) => {
          const [workMin, setWorkMin] = useState(25);
          const [breakMin, setBreakMin] = useState(5);
          const [timeLeft, setTimeLeft] = useState(25 * 60);
          const [isActive, setIsActive] = useState(false);
          const [mode, setMode] = useState('work');

          useEffect(() => {
            let interval = null;
            if (isActive && timeLeft > 0) {
              interval = setInterval(() => {
                setTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (timeLeft === 0) {
              const nextMode = mode === 'work' ? 'break' : 'work';
              setMode(nextMode);
              setTimeLeft((nextMode === 'work' ? workMin : breakMin) * 60);
              setIsActive(false);
            }
            return () => clearInterval(interval);
          }, [isActive, timeLeft, mode, workMin, breakMin]);

          const toggle = () => setIsActive(!isActive);
          const reset = () => {
            setIsActive(false);
            setTimeLeft((mode === 'work' ? workMin : breakMin) * 60);
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          return (
            <div className="flex flex-col items-center justify-center py-6">
              {/* Mode Toggle */}
              <div className="bg-[#EAE8E3] p-1 rounded-full flex mb-12 w-48 shadow-inner">
                <button 
                  onClick={() => { setMode('work'); setIsActive(false); setTimeLeft(workMin * 60); }} 
                  className={`flex-1 py-2 rounded-full text-sm font-bold transition-all ${mode === 'work' ? 'bg-white shadow-sm text-[#4A4A4A]' : 'text-[#A3A09A]'}`}
                >
                  {t.pomodoro.work}
                </button>
                <button 
                  onClick={() => { setMode('break'); setIsActive(false); setTimeLeft(breakMin * 60); }} 
                  className={`flex-1 py-2 rounded-full text-sm font-bold transition-all ${mode === 'break' ? 'bg-white shadow-sm text-[#4A4A4A]' : 'text-[#A3A09A]'}`}
                >
                  {t.pomodoro.break}
                </button>
              </div>

              {/* Timer Circle */}
              <div className="w-64 h-64 rounded-full border-[6px] border-[#EAE8E3] flex items-center justify-center mb-12 shadow-sm bg-white">
                <div className="text-6xl font-black tabular-nums tracking-tight text-[#4A4A4A]">
                  {formatTime(timeLeft)}
                </div>
              </div>

              {/* Controls */}
              <div className="flex gap-4">
                <button 
                  onClick={toggle} 
                  className="w-16 h-16 rounded-full bg-[#7C8363] text-white flex items-center justify-center shadow-lg hover:bg-[#6A7055] transition-all active:scale-95"
                >
                  {isActive ? <IconPause /> : <IconPlay />}
                </button>
                <button 
                  onClick={reset} 
                  className="w-16 h-16 rounded-full border border-gray-200 bg-white text-[#4A4A4A] flex items-center justify-center shadow-sm hover:bg-gray-50 transition-all active:scale-95"
                >
                  <IconReset />
                </button>
              </div>

              {/* Adjustment Controls */}
              {!isActive && (
                <div className="flex gap-6 mt-8 pt-6 border-t border-[#EAE8E3]">
                  <div className="flex flex-col items-center">
                    <label className="text-[10px] font-bold uppercase text-gray-400 mb-1">{t.pomodoro.work}</label>
                    <input 
                      type="number" min="1" max="60" value={workMin} 
                      onChange={(e) => { 
                        const v = parseInt(e.target.value) || 1; 
                        setWorkMin(v); 
                        if(mode === 'work') setTimeLeft(v * 60); 
                      }} 
                      className="w-16 text-center py-2 rounded-lg border border-[#E5E5E5] bg-[#FDFCFB] text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-[#7C8363]" 
                    />
                  </div>
                  <div className="flex flex-col items-center">
                    <label className="text-[10px] font-bold uppercase text-gray-400 mb-1">{t.pomodoro.break}</label>
                    <input 
                      type="number" min="1" max="30" value={breakMin} 
                      onChange={(e) => { 
                        const v = parseInt(e.target.value) || 1; 
                        setBreakMin(v); 
                        if(mode === 'break') setTimeLeft(v * 60); 
                      }} 
                      className="w-16 text-center py-2 rounded-lg border border-[#E5E5E5] bg-[#FDFCFB] text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-[#7C8363]" 
                    />
                  </div>
                </div>
              )}
            </div>
          );
        };

        const TimeDepositCalc = ({ t }) => {
          const [principal, setPrincipal] = useState('50000');
          const [rates, setRates] = useState(['1.5', '2.5', '3']);
          const [durations, setDurations] = useState(['1', '2', '3']);
          const [hoveredIdx, setHoveredIdx] = useState(null);

          const updateRate = (idx, val) => {
            const updated = [...rates];
            updated[idx] = val;
            setRates(updated);
          };

          const updateDuration = (idx, val) => {
            const updated = [...durations];
            updated[idx] = val;
            setDurations(updated);
          };

          const p = parseFloat(principal) || 0;
          const parsedRates = rates.map(r => parseFloat(r) || 0);
          const parsedDurations = durations.map(d => parseFloat(d) || 0);

          // Calculate interest earnings matrix: [rateIndex][durationIndex]
          const matrix = parsedRates.map(r => {
            return parsedDurations.map(d => Math.round(p * (r / 100) * (d / 12)));
          });

          // Dynamic scale for Y-Axis
          const maxEarned = Math.max(...matrix.flat(), 100);
          const yMax = Math.ceil(maxEarned / 100) * 100 || 800;
          const yTicks = [0, Math.round(yMax * 0.5), yMax];

          const lineColors = [
            { line: '#2563EB', fill: 'rgba(37, 99, 235, 0.12)' }, // Scenario A Blue
            { line: '#059669', fill: 'rgba(5, 150, 105, 0.12)' }, // Scenario B Green
            { line: '#D97706', fill: 'rgba(217, 119, 6, 0.12)' }   // Scenario C Orange
          ];

          // Enhanced SVG layout configurations
          const svgWidth = 620;
          const svgHeight = 260;
          const padL = 55, padR = 45, padT = 35, padB = 45;
          const plotW = svgWidth - padL - padR;
          const plotH = svgHeight - padT - padB;

          const getX = (dIdx) => padL + (dIdx / (parsedDurations.length - 1 || 1)) * plotW;
          const getY = (val) => padT + plotH - (val / yMax) * plotH;

          return (
            <div className="space-y-6">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                {/* Left Inputs Column */}
                <div className="lg:col-span-4 space-y-4">
                  {/* Principal Card */}
                  <div className="p-4 sm:p-5 rounded-2xl bg-white border border-[#E5E5E5] shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-blue-600 font-extrabold text-base">$</span>
                        <h3 className="font-bold text-sm sm:text-base">{t.depositCalc.principal}</h3>
                      </div>
                    </div>
                    <label className="block text-[10px] font-bold uppercase tracking-wider opacity-50 mb-1">
                      {t.depositCalc.amount}
                    </label>
                    <input
                      type="number"
                      inputMode="decimal"
                      value={principal}
                      onChange={(e) => setPrincipal(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none text-base font-extrabold bg-[#FDFCFB] text-[#4A4A4A]"
                    />
                    
                    {/* Quick Amount Presets */}
                    <div className="flex gap-1.5 mt-3 pt-3 border-t border-[#F0EBE3]">
                      {['10000', '50000', '100000', '500000'].map(amt => (
                        <button
                          key={amt}
                          onClick={() => setPrincipal(amt)}
                          className={`flex-1 text-[11px] font-bold py-1.5 px-1 rounded-lg border transition-all ${
                            principal === amt 
                              ? 'bg-[#7C8363] text-white border-[#7C8363] shadow-xs' 
                              : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                          }`}
                        >
                          ${parseInt(amt)/1000}k
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Rates Card */}
                  <div className="p-4 sm:p-5 rounded-2xl bg-white border border-[#E5E5E5] shadow-sm space-y-3">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-emerald-600 font-bold text-base">📈</span>
                      <h3 className="font-bold text-sm sm:text-base">{t.depositCalc.rates}</h3>
                    </div>
                    <div className="grid grid-cols-3 lg:grid-cols-1 gap-2.5">
                      {rates.map((rate, idx) => (
                        <div key={idx} className="flex flex-col lg:flex-row lg:items-center justify-between gap-1">
                          <label className="text-[10px] lg:text-xs font-bold uppercase tracking-wider text-gray-500 whitespace-nowrap">
                            {t.depositCalc.scenario} {String.fromCharCode(65 + idx)}
                          </label>
                          <div className="relative w-full lg:w-32">
                            <input
                              type="number"
                              inputMode="decimal"
                              step="0.01"
                              value={rate}
                              onChange={(e) => updateRate(idx, e.target.value)}
                              className="w-full pl-3 pr-6 py-2 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none text-sm font-bold bg-[#FDFCFB]"
                            />
                            <span className="absolute right-2.5 top-2 text-xs font-bold text-gray-400">%</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Durations Card */}
                  <div className="p-4 sm:p-5 rounded-2xl bg-white border border-[#E5E5E5] shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-amber-600 font-bold text-base">📅</span>
                      <h3 className="font-bold text-sm sm:text-base">{t.depositCalc.durations}</h3>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      {durations.map((dur, idx) => (
                        <div key={idx}>
                          <input
                            type="number"
                            inputMode="numeric"
                            value={dur}
                            onChange={(e) => updateDuration(idx, e.target.value)}
                            className="w-full text-center px-2 py-2 rounded-xl border border-[#E5E5E5] focus:ring-2 focus:ring-[#7C8363] outline-none text-sm font-bold bg-[#FDFCFB]"
                          />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Right Chart & Breakdown Column */}
                {}
                <div className="lg:col-span-8 bg-white p-5 sm:p-7 rounded-2xl border border-[#E5E5E5] shadow-md flex flex-col justify-between space-y-6">
                  <div>
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-[#F0EBE3]">
                      <div>
                        <h3 className="font-black text-base sm:text-lg text-[#4A4A4A]">{t.depositCalc.chartTitle}</h3>
                      </div>
                      {/* Legend Items matching reference design */}
                      <div className="flex flex-wrap items-center gap-4 text-xs font-semibold text-gray-700">
                        {parsedRates.map((r, rIdx) => (
                          <div key={rIdx} className="flex items-center gap-2">
                            <span 
                              className="w-3.5 h-3.5 rounded-full border-2 bg-white" 
                              style={{ borderColor: lineColors[rIdx].line }}
                            />
                            <span>{r}% {t.depositCalc.rateLabel}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* SVG Line Chart with Tooltip */}
                    <div className="w-full overflow-x-auto pt-2">
                      <svg 
                        viewBox={`0 0 ${svgWidth} ${svgHeight}`} 
                        className="w-full h-auto min-w-[320px] select-none"
                        onMouseLeave={() => setHoveredIdx(null)}
                      >
                        {/* Background Grid Box */}
                        <rect x={padL} y={padT} width={plotW} height={plotH} fill="#FAF9F6" rx="8" />

                        {/* Y Grid Lines */}
                        {yTicks.map((tick, i) => {
                          const y = getY(tick);
                          return (
                            <g key={i}>
                              <line x1={padL} y1={y} x2={svgWidth - padR} y2={y} stroke="#E5E5E5" strokeWidth="1" strokeDasharray={i === 0 ? "" : "4 4"} />
                              <text x={padL - 10} y={y + 4} textAnchor="end" className="text-[11px] fill-gray-500 font-bold font-sans">
                                {Math.round(tick)}
                              </text>
                            </g>
                          );
                        })}

                        {/* X Axis Labels */}
                        {parsedDurations.map((d, dIdx) => {
                          const x = getX(dIdx);
                          return (
                            <g key={dIdx}>
                              <line x1={x} y1={padT} x2={x} y2={padT + plotH} stroke="#E8E8E8" strokeWidth="1" strokeDasharray="3 3" />
                              <text x={x} y={svgHeight - 12} textAnchor="middle" className="text-[12px] fill-gray-700 font-extrabold font-sans">
                                {d} {d === 1 ? t.depositCalc.month : t.depositCalc.months}
                              </text>
                            </g>
                          );
                        })}

                        {/* Interactive Column Hover Zones */}
                        {parsedDurations.map((_, dIdx) => {
                          const x = getX(dIdx);
                          const colW = plotW / Math.max(parsedDurations.length - 1, 1);
                          return (
                            <rect
                              key={`hover-zone-${dIdx}`}
                              x={dIdx === 0 ? padL : x - colW / 2}
                              y={padT}
                              width={dIdx === 0 || dIdx === parsedDurations.length - 1 ? colW / 2 + 25 : colW}
                              fill="transparent"
                              height={plotH}
                              className="cursor-pointer"
                              onMouseEnter={() => setHoveredIdx(dIdx)}
                              onTouchStart={() => setHoveredIdx(dIdx)}
                            />
                          );
                        })}

                        {/* Dotted Vertical Guide Line on Hover */}
                        {hoveredIdx !== null && (
                          <line
                            x1={getX(hoveredIdx)}
                            y1={padT}
                            x2={getX(hoveredIdx)}
                            y2={padT + plotH}
                            stroke="#475569"
                            strokeWidth="1.5"
                            strokeDasharray="3 3"
                          />
                        )}

                        {/* Plot Lines & Area Fill */}
                        {matrix.map((row, rIdx) => {
                          const points = row.map((val, dIdx) => `${getX(dIdx)},${getY(val)}`).join(' ');
                          const fillPoints = `${getX(0)},${getY(0)} ${points} ${getX(row.length - 1)},${getY(0)}`;
                          
                          return (
                            <g key={rIdx}>
                              <polygon points={fillPoints} fill={lineColors[rIdx].fill} />
                              <polyline
                                fill="none"
                                stroke={lineColors[rIdx].line}
                                strokeWidth="3"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                points={points}
                              />
                              {row.map((val, dIdx) => {
                                const cx = getX(dIdx);
                                const cy = getY(val);
                                const isHovered = hoveredIdx === dIdx;
                                return (
                                  <g key={dIdx}>
                                    <circle
                                      cx={cx}
                                      cy={cy}
                                      r={isHovered ? "7" : "5"}
                                      fill="#FFFFFF"
                                      stroke={lineColors[rIdx].line}
                                      strokeWidth={isHovered ? "3.5" : "2.5"}
                                      className="transition-all duration-150 cursor-pointer"
                                      onMouseEnter={() => setHoveredIdx(dIdx)}
                                    />
                                  </g>
                                );
                              })}
                            </g>
                          );
                        })}

                        {/* Hover Tooltip Box */}
                        {hoveredIdx !== null && (
                          (() => {
                            const dVal = parsedDurations[hoveredIdx];
                            const tooltipX = getX(hoveredIdx);
                            const pointsY = matrix.map(row => getY(row[hoveredIdx]));
                            const avgY = pointsY.reduce((a, b) => a + b, 0) / pointsY.length;
                            
                            const boxW = 150;
                            const boxH = 26 + parsedRates.length * 20;
                            
                            let rectX = tooltipX + 12;
                            if (hoveredIdx >= parsedDurations.length - 1) {
                              rectX = tooltipX - boxW - 12;
                            }
                            let rectY = Math.min(Math.max(avgY - boxH / 2, padT + 5), padT + plotH - boxH - 5);

                            return (
                              <g className="pointer-events-none transition-all duration-150">
                                {/* Dark Card Tooltip Container */}
                                <rect
                                  x={rectX}
                                  y={rectY}
                                  width={boxW}
                                  height={boxH}
                                  rx="8"
                                  fill="#1E293B"
                                  fillOpacity="0.95"
                                  stroke="#334155"
                                  strokeWidth="1"
                                />
                                {/* Tooltip Header */}
                                <text
                                  x={rectX + 12}
                                  y={rectY + 18}
                                  className="text-[12px] font-bold fill-white font-sans"
                                >
                                  {dVal} {dVal === 1 ? t.depositCalc.month : t.depositCalc.months}
                                </text>
                                {/* Rate Rows with Color Legend Square */}
                                {parsedRates.map((r, rIdx) => {
                                  const val = matrix[rIdx][hoveredIdx];
                                  const rowY = rectY + 36 + rIdx * 19;
                                  return (
                                    <g key={rIdx}>
                                      <rect
                                        x={rectX + 12}
                                        y={rowY - 8}
                                        width="9"
                                        height="9"
                                        rx="1.5"
                                        fill={lineColors[rIdx].line}
                                      />
                                      <text
                                        x={rectX + 26}
                                        y={rowY}
                                        className="text-[11px] font-semibold fill-gray-200 font-sans"
                                      >
                                        {r}% {t.depositCalc.rateLabel}: ${val.toLocaleString()}
                                      </text>
                                    </g>
                                  );
                                })}
                              </g>
                            );
                          })()
                        )}
                      </svg>
                    </div>
                  </div>

                  {/* Breakdown Table */}
                  <div className="border-t border-[#F0EBE3] pt-4 overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="text-gray-400 border-b border-[#F0EBE3] text-xs">
                          <th className="pb-3 font-bold uppercase tracking-wider">{t.depositCalc.scenarioRate}</th>
                          {parsedDurations.map((d, dIdx) => (
                            <th key={dIdx} className="pb-3 font-bold text-right uppercase tracking-wider">{d} {d === 1 ? t.depositCalc.month : t.depositCalc.months}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#F8F6F0]">
                        {parsedRates.map((r, rIdx) => {
                          return (
                            <tr key={rIdx} className="hover:bg-gray-50/80 transition-colors">
                              <td className="py-3.5 font-bold text-sm text-[#4A4A4A] flex items-center gap-2">
                                <span className={`w-3 h-3 rounded-full`} style={{ backgroundColor: lineColors[rIdx].line }} />
                                <span>{String.fromCharCode(65 + rIdx)} ({r}%)</span>
                              </td>
                              {matrix[rIdx].map((earned, dIdx) => {
                                const isTargetHighlight = rIdx === dIdx && earned > 0;
                                return (
                                  <td key={dIdx} className="py-3.5 font-extrabold text-right text-sm sm:text-base text-gray-800">
                                    <span className={isTargetHighlight ? 'text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200' : ''}>
                                      ${earned.toLocaleString()}
                                    </span>
                                  </td>
                                );
                              })}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        function App() {
          const [currentView, setCurrentView] = useState('home');
          const [lang, setLang] = useState('zh');
          const [searchQuery, setSearchQuery] = useState('');
          const [activeCategory, setActiveCategory] = useState('all');

          const t = translations[lang];
          const toggleLang = () => setLang(lang === 'zh' ? 'en' : 'zh');

          const tools = [
            { id: 'purify', name: t.tools.purify.name, icon: IconShield, desc: t.tools.purify.desc, cat: t.tools.purify.cat, accent: 'bg-emerald-50 text-emerald-600' },
            { id: 'shorten', name: t.tools.shorten.name, icon: IconLink, desc: t.tools.shorten.desc, cat: t.tools.shorten.cat, accent: 'bg-amber-50 text-amber-600' },
            { id: 'qr', name: t.tools.qr.name, icon: IconQr, desc: t.tools.qr.desc, cat: t.tools.qr.cat, accent: 'bg-blue-50 text-blue-600' },
            { id: 'extract', name: t.tools.extract.name, icon: IconSearch, desc: t.tools.extract.desc, cat: t.tools.extract.cat, accent: 'bg-purple-50 text-purple-600' },
            { id: 'compare', name: t.tools.compare.name, icon: IconCalc, desc: t.tools.compare.desc, cat: t.tools.compare.cat, accent: 'bg-teal-50 text-teal-600' },
            { id: 'deposit', name: t.tools.deposit.name, icon: IconTrend, desc: t.tools.deposit.desc, cat: t.tools.deposit.cat, accent: 'bg-sky-50 text-sky-600' },
            { id: 'timer', name: t.tools.timer.name, icon: IconTimer, desc: t.tools.timer.desc, cat: t.tools.timer.cat, accent: 'bg-rose-50 text-rose-600' },
          ];

          const filteredTools = useMemo(() => {
            return tools.filter(tool => {
              const matchesCat = activeCategory === 'all' || tool.cat === activeCategory;
              const matchesQuery = !searchQuery.trim() || 
                tool.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                tool.desc.toLowerCase().includes(searchQuery.toLowerCase());
              return matchesCat && matchesQuery;
            });
          }, [tools, activeCategory, searchQuery]);

          const renderTool = () => {
            switch (currentView) {
              case 'purify': return <UrlPurifier t={t} />;
              case 'shorten': return <UrlShortener t={t} />;
              case 'qr': return <QrGenerator t={t} />;
              case 'extract': return <LinkExtractor t={t} />;
              case 'compare': return <PriceCompare t={t} />;
              case 'deposit': return <TimeDepositCalc t={t} />;
              case 'timer': return <Pomodoro t={t} />;
              default: return null;
            }
          };

          return (
            <div className="min-h-screen bg-[#F9F7F2] text-[#4A4A4A] font-sans flex flex-col md:flex-row pb-16 md:pb-0">
              {/* Desktop Sidebar */}
              <aside className="hidden md:flex w-72 bg-white border-r border-[#E5E5E5] flex-col justify-between p-6 sticky top-0 h-screen shrink-0">
                <div className="space-y-6">
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                    <div className="w-10 h-10 bg-[#7C8363] rounded-xl flex items-center justify-center text-white shadow-sm">
                      <IconGrid />
                    </div>
                    <div>
                      <h1 className="text-xl font-extrabold tracking-tight">{t.appName}</h1>
                      <span className="text-[10px] uppercase tracking-widest font-bold opacity-40">{t.suite}</span>
                    </div>
                  </div>

                  <nav className="space-y-1">
                    <button
                      onClick={() => setCurrentView('home')}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${
                        currentView === 'home'
                          ? 'bg-[#7C8363] text-white shadow-md'
                          : 'text-[#8C8C8C] hover:bg-[#F0EBE3] hover:text-[#4A4A4A]'
                      }`}
                    >
                      <IconGrid />
                      {t.home}
                    </button>
                    {tools.map(tool => {
                      const ToolIcon = tool.icon;
                      return (
                        <button
                          key={tool.id}
                          onClick={() => setCurrentView(tool.id)}
                          className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${
                            currentView === tool.id
                              ? 'bg-[#7C8363] text-white shadow-md'
                              : 'text-[#8C8C8C] hover:bg-[#F0EBE3] hover:text-[#4A4A4A]'
                          }`}
                        >
                          <ToolIcon />
                          {tool.name}
                        </button>
                      );
                    })}
                  </nav>
                </div>

                <div className="pt-4 border-t border-[#E5E5E5] flex flex-col gap-3">
                  <Button variant="outline" onClick={toggleLang} icon={IconGlobe} className="w-full text-xs py-2">
                    {t.langBtn}
                  </Button>
                  <p className="opacity-30 text-[10px] tracking-[0.2em] uppercase font-black text-center">
                    EcoTools • v1.5 Mobile UX
                  </p>
                </div>
              </aside>

              {/* Mobile Header */}
              <header className="md:hidden sticky top-0 z-40 glass-nav border-b border-[#E5E5E5] shadow-xs">
                <div className="px-4 py-3 flex items-center justify-between">
                  {currentView === 'home' ? (
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 bg-[#7C8363] rounded-xl flex items-center justify-center text-white shadow-sm">
                        <IconGrid />
                      </div>
                      <div>
                        <h1 className="text-lg font-black tracking-tight leading-none">{t.appName}</h1>
                        <span className="text-[9px] font-bold text-gray-400 uppercase tracking-widest">{t.suite}</span>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setCurrentView('home')}
                        className="p-2 -ml-2 text-gray-600 hover:bg-[#F0EBE3] rounded-full transition-colors active:scale-95"
                        aria-label="Back to home"
                      >
                        <IconChevron />
                      </button>
                      <h1 className="text-base font-extrabold truncate max-w-[180px]">
                        {tools.find(t => t.id === currentView)?.name}
                      </h1>
                    </div>
                  )}

                  <button 
                    onClick={toggleLang}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-[#E5E5E5] text-xs font-bold text-[#7C8363] shadow-xs active:scale-95 transition-transform"
                  >
                    <IconGlobe />
                    {t.langBtn}
                  </button>
                </div>
                
                {/* Horizontal Tool Scroll Bar on Mobile when inside a tool */}
                {currentView !== 'home' && (
                  <div className="px-3 pb-2.5 flex gap-2 overflow-x-auto no-scrollbar pt-1">
                    {tools.map(tool => {
                      const ToolIcon = tool.icon;
                      const isSelected = currentView === tool.id;
                      return (
                        <button
                          key={tool.id}
                          onClick={() => setCurrentView(tool.id)}
                          className={`flex-shrink-0 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all active:scale-95 ${
                            isSelected 
                              ? 'bg-[#7C8363] text-white shadow-sm' 
                              : 'bg-white border border-[#E5E5E5] text-gray-600'
                          }`}
                        >
                          <ToolIcon />
                          <span>{tool.name}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </header>

              {/* Main Content Area */}
              <main className="flex-1 p-4 sm:p-6 md:p-10 overflow-y-auto max-w-6xl mx-auto w-full">
                {currentView === 'home' ? (
                  <div className="animate-fade-in max-w-3xl mx-auto space-y-6">
                    {/* Hero Banner */}
                    <section className="text-center md:text-left pt-2 sm:pt-4">
                      <div className="flex items-center justify-center md:justify-start gap-1.5 mb-2 text-[#7C8363]">
                        <IconZap />
                        <span className="text-[10px] font-black uppercase tracking-[0.2em]">Efficiency Dashboard</span>
                      </div>
                      <h2 className="text-2xl sm:text-3xl md:text-4xl font-black text-[#4A4A4A] tracking-tight mb-2">
                        {t.tagline}
                      </h2>
                      <p className="text-gray-500 text-xs sm:text-sm leading-relaxed max-w-xl mx-auto md:mx-0">
                        {t.desc}
                      </p>
                    </section>

                    {/* Mobile Quick Search & Category Filter */}
                    <div className="space-y-3">
                      <div className="relative">
                        <span className="absolute left-3.5 top-3 text-gray-400">
                          <IconSearch />
                        </span>
                        <input
                          type="text"
                          placeholder={t.searchPlaceholder}
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#E5E5E5] bg-white text-sm outline-none focus:ring-2 focus:ring-[#7C8363] transition-all shadow-2xs"
                        />
                        {searchQuery && (
                          <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-xs text-gray-400 p-1">
                            ✕
                          </button>
                        )}
                      </div>

                      {/* Category Pills */}
                      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                        {[
                          { id: 'all', label: t.catAll },
                          { id: 'utils', label: t.catUtils },
                          { id: 'finance', label: t.catFinance },
                          { id: 'focus', label: t.catFocus },
                        ].map(cat => (
                          <button
                            key={cat.id}
                            onClick={() => setActiveCategory(cat.id)}
                            className={`flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
                              activeCategory === cat.id
                                ? 'bg-[#7C8363] text-white shadow-xs'
                                : 'bg-white border border-[#E5E5E5] text-gray-500 hover:text-gray-800'
                            }`}
                          >
                            {cat.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Grid of Tools */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      {filteredTools.map(tool => {
                        const ToolIcon = tool.icon;
                        return (
                          <Card key={tool.id} onClick={() => setCurrentView(tool.id)} className="flex items-center gap-3.5 group active:scale-[0.98]">
                            <div className={`w-12 h-12 sm:w-14 sm:h-14 ${tool.accent.split(' ')[0]} rounded-2xl flex items-center justify-center ${tool.accent.split(' ')[1]} group-hover:bg-[#7C8363] group-hover:text-white transition-all duration-300 shadow-2xs shrink-0`}>
                              <ToolIcon />
                            </div>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center justify-between mb-0.5">
                                <h3 className="font-bold text-[#4A4A4A] text-sm sm:text-base truncate">{tool.name}</h3>
                              </div>
                              <p className="text-xs text-[#8C8C8C] leading-snug truncate">{tool.desc}</p>
                            </div>
                            <div className="w-7 h-7 rounded-full bg-[#F9F7F2] flex items-center justify-center opacity-40 group-hover:opacity-100 transition-opacity shrink-0">
                              <IconChevron className="rotate-180 text-[#D4A373] w-4 h-4" />
                            </div>
                          </Card>
                        );
                      })}
                    </div>
                  </div>
                ) : (
                  <div className={`animate-fade-in mx-auto space-y-4 ${currentView === 'deposit' || currentView === 'compare' ? 'max-w-5xl' : 'max-w-2xl'}`}>
                     <div className="mb-4">
                        <div className="hidden md:flex items-center gap-2 text-xs font-bold text-[#7C8363] mb-1.5 uppercase tracking-wider">
                          <span>EcoTools</span>
                          <span>/</span>
                          <span>{tools.find(t => t.id === currentView)?.name}</span>
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-black tracking-tight">{tools.find(t => t.id === currentView)?.name}</h2>
                        <p className="text-xs sm:text-sm text-[#8C8C8C] mt-1">{tools.find(t => t.id === currentView)?.desc}</p>
                     </div>
                    {renderTool()}
                  </div>
                )}
              </main>

              {/* Fixed Bottom Mobile Navigation Bar */}
              <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#E5E5E5] px-4 py-2 z-50 flex justify-around items-center shadow-lg">
                <button 
                  onClick={() => setCurrentView('home')}
                  className={`flex flex-col items-center gap-1 p-1 transition-all ${
                    currentView === 'home' ? 'text-[#7C8363] font-bold' : 'text-gray-400'
                  }`}
                >
                  <IconGrid />
                  <span className="text-[10px] font-bold">{t.home}</span>
                </button>

                <button 
                  onClick={() => setCurrentView('compare')}
                  className={`flex flex-col items-center gap-1 p-1 transition-all ${
                    currentView === 'compare' ? 'text-[#7C8363] font-bold' : 'text-gray-400'
                  }`}
                >
                  <IconCalc />
                  <span className="text-[10px] font-bold">{t.tools.compare.name}</span>
                </button>

                <button 
                  onClick={() => setCurrentView('deposit')}
                  className={`flex flex-col items-center gap-1 p-1 transition-all ${
                    currentView === 'deposit' ? 'text-[#7C8363] font-bold' : 'text-gray-400'
                  }`}
                >
                  <IconTrend />
                  <span className="text-[10px] font-bold">{t.tools.deposit.name}</span>
                </button>

                <button 
                  onClick={() => setCurrentView('purify')}
                  className={`flex flex-col items-center gap-1 p-1 transition-all ${
                    currentView === 'purify' ? 'text-[#7C8363] font-bold' : 'text-gray-400'
                  }`}
                >
                  <IconShield />
                  <span className="text-[10px] font-bold">{t.tools.purify.name}</span>
                </button>
              </nav>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
