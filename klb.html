<!DOCTYPE html>

    <style>
        :root {
            --primary: #e11d48;
            --primary-light: #fda4af;
            --primary-dark: #be123c;
            --primary-bg: #fff1f2;
            --primary-bg-soft: #ffe4e6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(225 29 72 / 0.08), 0 2px 4px -2px rgb(225 29 72 / 0.06);
            --shadow-lg: 0 10px 15px -3px rgb(225 29 72 / 0.12), 0 4px 6px -4px rgb(225 29 72 / 0.08);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(160deg, var(--primary-bg) 0%, #fff7ed 40%, #f8fafc 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, #fb7185 100%);
            color: white;
            padding: 1.75rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 1.75rem;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -10%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        header h1 {
            font-size: clamp(1.5rem, 3vw, 1.85rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.35rem;
            position: relative;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.92;
            position: relative;
        }

        /* Controls card */
        .controls {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(225, 29, 72, 0.12);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 1100px) {
            .controls-grid {
                grid-template-columns: 1.5fr 1fr 1fr 0.9fr auto auto;
                align-items: end;
            }
        }

        @media (min-width: 768px) and (max-width: 1099px) {
            .controls-grid {
                grid-template-columns: 1fr 1fr 1fr;
                align-items: end;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        input[type="search"],
        select {
            padding: 0.6rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        input[type="search"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 1.1rem;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(190, 18, 60, 0.3);
        }

        .btn-secondary {
            background: var(--primary-bg-soft);
            color: var(--primary-dark);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            color: white;
        }

        .btn-link-openrice {
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #ffedd5;
            padding: 0.25rem 0.6rem;
            font-size: 0.78rem;
        }

        .btn-link-openrice:hover {
            background: #ea580c;
            color: white;
            border-color: #ea580c;
        }

        .btn-link-google {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #dbeafe;
            padding: 0.25rem 0.6rem;
            font-size: 0.78rem;
        }

        .btn-link-google:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Stats bar */
        .stats {

            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .stats strong {
            color: var(--primary-dark);
            font-weight: 600;
        }

        /* Table wrapper */
        .table-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(225, 29, 72, 0.1);
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            min-width: 1050px;
        }

        thead {
            background: linear-gradient(90deg, var(--primary-dark), var(--primary));
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 0.85rem 0.9rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        th .sort-icon {
            display: inline-block;
            margin-left: 0.25rem;
            opacity: 0.6;
            font-size: 0.7rem;
        }

        th.sorted-asc .sort-icon::after {
            content: "▲";
            opacity: 1;
        }
        th.sorted-desc .sort-icon::after {
            content: "▼";
            opacity: 1;
        }
        th:not(.sorted-asc):not(.sorted-desc) .sort-icon::after {
            content: "↕";
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:nth-child(even) {
            background: #fffcfc;
        }

        tbody tr:hover {
            background: var(--primary-bg);
        }

        td {
            padding: 0.75rem 0.9rem;
            vertical-align: top;
        }

        .id-col {
            font-weight: 600;
            color: var(--text-muted);
            width: 50px;
            text-align: center;
        }

        .name-col {
            font-weight: 700;
            color: var(--primary-dark);
            min-width: 180px;
        }

        .restaurant-name-link {
            color: var(--primary-dark);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .restaurant-name-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .area-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            white-space: nowrap;
        }

        .type-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--primary-bg-soft);
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .desc-text {
            max-width: 320px;
            font-size: 0.825rem;
            color: #374151;
            line-height: 1.45;
        }

        .address-text {
            font-size: 0.825rem;
            color: var(--text-muted);
            max-width: 220px;
        }

        .hours-text {
            font-size: 0.825rem;
            white-space: pre-line;
            min-width: 160px;
        }

        .links-cell {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 120px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-muted);
        }

        /* Pagination */
        .pagination {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: #fffcfc;
            border-top: 1px solid var(--border);
        }

        .pagination-left {
            justify-self: start;
        }
        .pagination-center {
            justify-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
        }
        .pagination-right {
            justify-self: end;
        }

        .page-info {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .page-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-btn {
            min-width: 2.25rem;
            height: 2.25rem;
            padding: 0 0.5rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text);
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary-dark);
            background: var(--primary-bg);
        }

        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

            gap: 1rem;

                grid-template-columns: repeat(2, 1fr);
            }

            .cards-view {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .table-card.view-table .table-scroll {
            display: block;
        }
        .table-card.view-table .cards-view {
            display: none;
        }
        .table-card.view-cards .table-scroll {
            display: none;
        }
        .table-card.view-cards .cards-view {
            display: grid;
        }

            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);

            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;

            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;

            color: var(--primary-dark);

        }

            font-size: 0.875rem;
            color: #4b5563;
            line-height: 1.5;
        }

            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .restaurant-card .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;

            .pagination {

                flex-direction: column;
                align-items: center;
                gap: 0.85rem;
            }
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>香港美食指南 &amp; 地道餐廳目錄</h1>
            <p>精選平民美食、人氣小店及特色餐廳列表 — 支援地區、菜式篩選、搜尋及匯出 Excel</p>
        </header>

        <div class="controls">
            <div class="controls-grid">
                <div class="form-group">
                    <label for="search">關鍵字搜尋</label>
                    <input type="search" id="search" placeholder="搜尋餐廳名稱、簡介、地址或電話…" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="areaFilter">地區</label>
                    <select id="areaFilter">
                        <option value="">全部地區</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="typeFilter">菜式 / 類型</label>
                    <select id="typeFilter">
                        <option value="">全部菜式</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="viewMode">顯示方式</label>
                    <select id="viewMode">
                        <option value="table" selected>表格檢視</option>
                        <option value="cards">卡片檢視</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="button" class="btn btn-secondary" id="resetBtn">重設條件</button>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="button" class="btn btn-primary" id="exportBtn" title="匯出目前篩選結果至 Excel (CSV)">匯出至 Excel</button>
                </div>
            </div>
        </div>

        <div class="stats" id="stats">
            顯示第 <strong id="showingCount">0</strong> 項，共 <strong id="totalCount">0</strong> 間餐廳
        </div>

        <div class="table-card view-table" id="tableCard">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>

                            <th data-key="area">地區 <span class="sort-icon"></span></th>
                            <th data-key="type">菜式／類型 <span class="sort-icon"></span></th>
                            <th data-key="name">餐廳名稱 <span class="sort-icon"></span></th>
                            <th data-key="desc">簡介</th>
                            <th data-key="address">地址</th>
                            <th data-key="hoursPhone">營業時間與電話</th>
                            <th>對外連結</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Card View -->
            <div class="cards-view" id="cardsView"></div>

            <div class="pagination" id="pagination">
                <div class="pagination-left">
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.5rem;">
                        <label for="pageSize" style="margin-bottom: 0; white-space: nowrap;">每頁顯示：</label>
                        <select id="pageSize" style="width: auto; padding: 0.4rem 0.6rem;">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="all">全部</option>
                        </select>
                    </div>
                </div>
                <div class="pagination-center">
                    <div class="page-controls" id="pageControls"></div>
                </div>
                <div class="pagination-right">
                    <div class="page-info" id="pageInfo"></div>
                </div>
            </div>
        </div>

        <footer>
            資料僅供參考，營業時間與選單請以各餐廳 OpenRice 或現場公佈為準。
        </footer>
    </div>

                            </div>
                            <div class="card-actions">
                                <a href="${escapeHtml(row.openrice)}" target="_blank" rel="noopener noreferrer" class="btn btn-link-openrice" style="flex: 1; text-align: center;">OpenRice</a>
                                <a href="${escapeHtml(row.google)}" target="_blank" rel="noopener noreferrer" class="btn btn-link-google" style="flex: 1; text-align: center;">Google 搜尋</a>
                            </div>
                        </div>
                    `;
                    cardsView.appendChild(card);
                });
            }

            renderPagination(total, size);
            updateSortIndicators();
        }

        function renderPagination(total, size) {
            pageControls.innerHTML = "";
            if (pageSize === "all" || total === 0) {
                pageInfo.textContent = total === 0 ? "無資料" : `共 ${total} 項`;
                return;
            }

            const totalPages = Math.ceil(total / size);
            pageInfo.textContent = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;

            // Prev
            const prev = document.createElement("button");
            prev.className = "page-btn";
            prev.textContent = "‹";
            prev.disabled = currentPage === 1;
            prev.addEventListener("click", () => { currentPage--;
                render(); });
            pageControls.appendChild(prev);

            const maxButtons = 5;
            let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let end = Math.min(totalPages, start + maxButtons - 1);
            if (end - start + 1 < maxButtons) start = Math.max(1, end - maxButtons + 1);

            if (start > 1) {
                const b = document.createElement("button");
                b.className = "page-btn";
                b.textContent = "1";
                b.addEventListener("click", () => { currentPage = 1;
                    render(); });
                pageControls.appendChild(b);
                if (start > 2) {
                    const dots = document.createElement("span");
                    dots.textContent = "…";
                    dots.style.padding = "0 0.25rem";
                    pageControls.appendChild(dots);
                }
            }

            for (let i = start; i <= end; i++) {
                const b = document.createElement("button");
                b.className = "page-btn" + (i === currentPage ? " active" : "");
                b.textContent = i;
                b.addEventListener("click", () => { currentPage = i;
                    render(); });
                pageControls.appendChild(b);
            }

            if (end < totalPages) {
                if (end < totalPages - 1) {
                    const dots = document.createElement("span");
                    dots.textContent = "…";
                    dots.style.padding = "0 0.25rem";
                    pageControls.appendChild(dots);
                }
                const b = document.createElement("button");
                b.className = "page-btn";
                b.textContent = totalPages;
                b.addEventListener("click", () => { currentPage = totalPages;
                    render(); });
                pageControls.appendChild(b);
            }

            // Next
            const next = document.createElement("button");
            next.className = "page-btn";
            next.textContent = "›";
            next.disabled = currentPage === totalPages;
            next.addEventListener("click", () => { currentPage++;
                render(); });
            pageControls.appendChild(next);
        }

        function updateSortIndicators() {
            document.querySelectorAll("th[data-key]").forEach(th => {
                th.classList.remove("sorted-asc", "sorted-desc");
                if (th.dataset.key === sortKey) {
                    th.classList.add(sortDir === "asc" ? "sorted-asc" : "sorted-desc");
                }
            });
        }

        function escapeHtml(str) {
            if (str == null) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // Export currently filtered data as CSV (compatible with Excel)
        function exportToExcel() {
            if (filtered.length === 0) {
                alert("沒有可匯出的資料。請調整篩選條件。");
                return;
            }

            const headers = [
                "編號",
                "地區",
                "菜式/類型",
                "餐廳名稱",
                "簡介",
                "地址",
                "營業時間與電話",
                "OpenRice連結",
                "Google搜尋連結"
            ];

            const escapeCsv = (val) => {
                const s = (val == null || val === "") ? "" : String(val);
                if (/[",\n\r]/.test(s)) {
                    return `"${s.replace(/"/g, '""')}"`;
                }
                return s;
            };

            const rows = filtered.map(r => [
                escapeCsv(r.id),
                escapeCsv(r.area),
                escapeCsv(r.type),
                escapeCsv(r.name),
                escapeCsv(r.desc),
                escapeCsv(r.address),
                escapeCsv(r.hoursPhone),
                escapeCsv(r.openrice),
                escapeCsv(r.google)
            ].join(","));

            const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const timestamp = new Date().toISOString().slice(0, 10);
            link.href = url;
            link.download = `hong-kong-restaurant-list-${timestamp}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function applyViewMode(mode) {
            const selected = mode || viewModeSelect.value || "table";
            tableCard.classList.remove("view-table", "view-cards");
            tableCard.classList.add(selected === "cards" ? "view-cards" : "view-table");
            viewModeSelect.value = selected === "cards" ? "cards" : "table";
        }

        // Event listeners
        searchInput.addEventListener("input", debounce(applyFilters, 200));
        areaFilter.addEventListener("change", applyFilters);
        typeFilter.addEventListener("change", applyFilters);
        pageSizeSelect.addEventListener("change", () => {
            const val = pageSizeSelect.value;
            pageSize = val === "all" ? "all" : parseInt(val, 10);
            currentPage = 1;
            render();
        });

        viewModeSelect.addEventListener("change", () => {
            applyViewMode(viewModeSelect.value);
        });

        resetBtn.addEventListener("click", () => {
            searchInput.value = "";
            areaFilter.value = "";
            typeFilter.value = "";
            pageSizeSelect.value = "20";
            pageSize = 20;
            sortKey = "id";
            sortDir = "asc";
            applyFilters();
        });

        exportBtn.addEventListener("click", exportToExcel);

        document.querySelectorAll("th[data-key]").forEach(th => {
            th.addEventListener("click", () => {
                const key = th.dataset.key;
                if (sortKey === key) {
                    sortDir = sortDir === "asc" ? "desc" : "asc";
                } else {
                    sortKey = key;
                    sortDir = "asc";
                }
                applyFilters();
            });
        });

        function debounce(fn, ms) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), ms);
            };
        }

        // Initial render
        applyFilters();
    </script>
</body>
</html>
