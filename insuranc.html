  <script>
    const report = {
      zh: {
        label:"分析報告 / 01", title:"保險的本質、功能與理性選擇", subtitle:"客觀分析報告", intro:"保險作為現代金融體系的重要工具，其價值一直存在不同討論。本報告從機制、功能與限制出發，提供一個可用於個人決策的分析框架。", byline:"研究型閱讀稿", read:"閱讀時間約 8 分鐘", contents:"章節索引", conclusion:"結論", language:"English", languageShort:"EN", jump:"跳至章節", noteTitle:"研究線索", noteText:"先識別風險，再衡量保障。閱讀每一節，建立自己的判斷框架。", backTop:"返回頁首", footer:"保險分析報告 · 以機制理解風險",
        sections:[
          {id:"orientation",num:"01",nav:"分析起點",eyebrow:"問題設定",title:"保險的定位，並非單一答案",p:["保險作為現代金融體系的核心工具，長期引發社會各界對其價值的討論。部分觀點認為購買保險等同於無謂支出，甚至被視為對消費者判斷力的負擔；另一些則強調其在風險管理中的不可替代性。","本報告從客觀分析角度出發，系統檢視保險的基本性質、歷史演變、核心功能、潛在缺陷，以及適用對象，旨在提供清晰的分析框架，協助個人根據自身情況作出理性決策。報告聚焦於保險的實質機制與結構性特徵，避免主觀評價，並以正式專業語言闡述相關概念與邏輯。"]},
          {id:"mechanism",num:"02",nav:"起源與機制",eyebrow:"風險池",title:"把個別不確定性轉化為群體可管理的風險",art:"pool",p:["保險的起源可追溯至人類社會早期的互助行為。在群體生活中，個體面對不可預見的損失時，透過資源共享降低整體風險；此種模式在商業活動興起後逐漸制度化。工業革命後，海上貿易風險促使正式保險合約出現，精算學隨之發展，運用大數法則計算事件發生機率，並據此設定保費。","精算原理的核心在於將個別不確定性轉化為可預測的群體風險：保險機構收取保費，建立資金池，於損失發生時進行補償。此機制本質上類似於風險池運作，機構透過統計模型確保長期財務平衡，而非依賴個別事件的結果。保險並非賭博，亦非單純投資工具；其基本定位為風險轉移與費用平滑。"],strip:["機制摘要","固定保費 → 資金池 → 損失補償 → 長期財務平衡"]},
          {id:"functions",num:"03",nav:"三項功能",eyebrow:"功能界定",title:"風險轉移、開支平滑與流動性支持",p:["保險具備三大主要功能。第一，風險轉移：個人以固定保費換取機構承擔潛在巨額損失的責任，避免單一災難導致財務崩潰。第二，開支平滑：將可能的大額突發支出轉化為可預期的定期繳費，有助於現金流管理。第三，自我保障與流動性支持：在特定情況下，保單可提供緊急資金來源，減少對個人儲備的過度依賴。","這些功能在純保障型產品中最為明顯，例如定期人壽保險、意外保險或醫療保險，其設計目標明確，即以較低成本覆蓋特定風險。歷史上，保險業早期多集中於此類產品，運作相對透明。"]},
          {id:"market",num:"04",nav:"市場轉變",eyebrow:"結構性考量",title:"當保障與投資被包裝在同一份產品中",p:["然而，保險市場在近數十年出現結構性轉變。競爭加劇與利潤壓力促使產品複雜化，傳統純保障產品逐漸被投資相連或儲蓄型保險取代。此類產品將保障與投資或儲蓄元素結合，保費部分用於風險保障，部分投入基金或長期儲蓄帳戶。","問題在於費用結構往往不透明，管理費、佣金及行政成本可能顯著侵蝕本金與回報。學術與市場數據顯示，許多投資相連產品長期表現遜於簡單指數投資工具；個人若具備基本投資知識，直接配置資產往往更具效率。此外，行業銷售文化亦構成潛在缺陷。代理人報酬多與保費金額及產品複雜度掛鉤，導致高佣金產品被優先推廣，而簡單、低成本的保障型產品則較少被主動介紹。此種誘因結構可能使消費者購買與實際需求不完全匹配的產品。"]},
          {id:"terms",num:"05",nav:"條款與理賠",eyebrow:"程序風險",title:"理解除外責任與證據要求，才算理解保障範圍",art:"terms",p:["政策條款風險是另一關鍵考量。保險合約通常包含詳細除外責任，尤其針對系統性風險，如大規模天災、戰爭或流行病。這些事件因發生機率難以精確量化，且可能同時影響大量保單持有人，超出保險機構可承受範圍，故被明確排除。","理賠過程亦存在嚴格程序要求。以旅遊保險為例，成功索償往往取決於即時記錄證據，包括損壞照片、收據、電子登機證或官方證明。欠缺完整文件即可能導致理賠失敗；此「單一程序步驟」足以決定結果。儲蓄型保險則可能出現本金被費用逐步消耗的情況，長期持有後實際收益有限，甚至低於通脹調整後的購買力。"],strip:["實務檢核","除外責任、索償時限、證據清單與費用揭露，皆應在投保前閱讀。"]},
          {id:"fit",num:"06",nav:"適用對象",eyebrow:"匹配原則",title:"保障的價值，取決於責任與承受能力",p:["關於適用對象，客觀分析顯示保險最適合具有中等收入、需供養家庭成員或存在特定責任的群體。例如，主要收入來源者若過早離世，可能導致家庭經濟困難，定期人壽保險可提供明確保障。健康風險較高或醫療開支可能造成負擔者，亦可考慮相應保障。","相對而言，收入極低者可能難以負擔保費，而高資產者則有能力透過自我儲備應對風險，無需依賴保險。強制性保險如汽車或樓宇保險屬例外，因法律或合約要求而必須購買。純投資或儲蓄目的應優先考慮直接金融工具，而非透過保險包裝。"]},
          {id:"outlook",num:"07",nav:"科技與結語",eyebrow:"未來脈絡",title:"效率提升，也帶來公平性的提問",p:["科技發展對保險業帶來新變化。保險科技運用大數據與演算法提升風險評估精度，可能使低風險群體獲得較優惠保費，但同時可能加劇高風險群體的排除效應，形成定價分化。此趨勢有助提升效率，亦需關注公平性議題。","綜合上述分析，保險的核心價值在於其風險轉移與費用平滑功能，特別是在純保障產品中得以充分體現。市場複雜化、銷售誘因與條款細節構成主要挑戰；消費者需仔細評估自身風險敞口、財務能力與產品結構，而非僅憑推銷資訊作出決定。理性選擇應以實際保障需求為優先，避免將保險視為主要投資或儲蓄工具。透過理解精算基礎、功能定位與潛在缺陷，個人可更有效地運用此金融工具，實現財務風險的可控管理。"]}
        ], closing:"保險不是萬能方案，也不是無謂負擔；它的效用取決於保障設計是否精準對應使用者實際承擔的風險。"
      },
      en: {
        label:"ANALYSIS NOTE / 01", title:"Insurance: Its Nature, Functions & Rational Choice", subtitle:"An Objective Analysis", intro:"Insurance is an important instrument within modern financial systems, yet its value is often debated. This report examines its mechanism, functions, and constraints to offer a practical framework for individual decisions.", byline:"Research reader", read:"Approximately 8 minutes", contents:"Contents", conclusion:"Conclusion", language:"繁體中文", languageShort:"繁", jump:"Jump to section", noteTitle:"Research thread", noteText:"Identify the risk before assessing the protection. Read each section to build your own decision framework.", backTop:"Back to top", footer:"Insurance analysis · Understand risk through mechanism",
        sections:[
          {id:"orientation",num:"01",nav:"Starting point",eyebrow:"Framing the question",title:"Insurance has a role—not a single answer",p:["As a core tool in modern financial systems, insurance has long prompted debate about its value. Some regard it as an unnecessary expense or a drag on consumer judgment; others stress its irreplaceable role in risk management.","This report takes an objective approach, examining insurance’s essential nature, historical development, core functions, potential shortcomings, and appropriate users. Its purpose is to provide a clear analytical framework that helps people make rational decisions based on their own circumstances, focusing on mechanisms and structural features rather than subjective evaluation."]},
          {id:"mechanism",num:"02",nav:"Origins & mechanism",eyebrow:"The risk pool",title:"Turning individual uncertainty into manageable group risk",art:"pool",p:["Insurance can be traced to early forms of mutual aid. When people in a group faced unforeseen losses, shared resources lowered the collective burden. As commerce expanded, this model became institutionalised. Maritime trade after the Industrial Revolution helped produce formal insurance contracts, while actuarial science developed to estimate event probabilities under the law of large numbers and to set premiums accordingly.","The central actuarial idea is to transform individual uncertainty into group risk that can be predicted. Insurers collect premiums, establish a pool of funds, and compensate losses when they occur. The institution seeks long-term financial balance through statistical modelling rather than relying on any single outcome. Insurance is not gambling, nor is it simply an investment tool; its fundamental function is risk transfer and expense smoothing."],strip:["Mechanism, condensed","Fixed premium → pooled fund → loss compensation → long-term balance"]},
          {id:"functions",num:"03",nav:"Three functions",eyebrow:"Functional definition",title:"Risk transfer, expense smoothing, and liquidity support",p:["Insurance has three principal functions. First, risk transfer: an individual pays a fixed premium in exchange for an institution taking responsibility for a potentially large loss, reducing the chance that a single disaster causes financial collapse. Second, expense smoothing: a potentially large unexpected bill becomes a predictable periodic payment, supporting cash-flow management. Third, protection and liquidity support: in certain circumstances, a policy can provide emergency funds and reduce excessive dependence on personal reserves.","These functions are clearest in pure-protection products, such as term life, accident, or medical insurance. Their objective is explicit: cover a defined risk at a relatively low cost. Historically, early insurance markets concentrated on these more transparent products."]},
          {id:"market",num:"04",nav:"Market shifts",eyebrow:"Structural considerations",title:"When protection and investment are packaged together",p:["Insurance markets have changed structurally in recent decades. Stronger competition and pressure on margins have made products more complex, with traditional pure-protection policies increasingly replaced by investment-linked or savings-oriented insurance. These products combine protection with investing or saving: part of a premium pays for risk cover, while another part is directed into funds or long-term savings accounts.","Their fee structures can be opaque, and management charges, commissions, and administration costs may materially erode principal and returns. Academic and market evidence indicates that many investment-linked products underperform simple index instruments over long horizons; for people with basic investment knowledge, direct asset allocation may often be more efficient. Sales culture is another possible weakness. Where agent remuneration is linked to premium size and product complexity, high-commission products may receive priority while simple, low-cost protection is introduced less often. These incentives can leave consumers with products that do not fully match their needs."]},
          {id:"terms",num:"05",nav:"Terms & claims",eyebrow:"Procedural risk",title:"To understand cover, understand exclusions and evidence",art:"terms",p:["Policy-wording risk is another key consideration. Insurance contracts commonly contain detailed exclusions, particularly for systemic risks such as large-scale natural disasters, war, or pandemics. Because these events are difficult to quantify precisely and may affect many policyholders at once—beyond an insurer’s capacity—they may be explicitly excluded.","Claims processes also carry strict procedural requirements. In travel insurance, for example, a successful claim may depend on recording evidence promptly: photographs of damage, receipts, electronic boarding passes, or official documentation. Missing records can cause a claim to fail; a single procedural step may determine the outcome. Savings-oriented insurance can also see principal gradually consumed by fees, leaving long-term real returns limited or even below inflation-adjusted purchasing power."],strip:["Practical check","Read exclusions, claim deadlines, evidence requirements, and fee disclosures before committing."]},
          {id:"fit",num:"06",nav:"Who benefits",eyebrow:"The matching principle",title:"The value of cover depends on responsibility and capacity",p:["Objectively, insurance is most relevant to people with middle incomes, dependants, or defined obligations. If a household’s principal earner dies prematurely, for example, term life insurance can provide clear protection against the resulting financial strain. People with higher health risks or medical costs that could become burdensome may also consider appropriate cover.","By contrast, people with very low income may struggle to afford premiums, while those with substantial assets may be able to self-insure through their own reserves. Mandatory insurance, such as motor or property cover, is an exception because law or contract requires it. For purely investment or savings objectives, direct financial instruments should generally be considered before an insurance wrapper."]},
          {id:"outlook",num:"07",nav:"Technology & close",eyebrow:"What changes next",title:"Efficiency can also raise questions of fairness",p:["Technology is bringing new changes to insurance. Insurtech applies data and algorithms to improve the precision of risk assessment, potentially giving lower-risk groups more favourable premiums. At the same time, it may intensify exclusion effects for higher-risk groups and create more differentiated pricing. The trend can improve efficiency, but it also raises questions of fairness.","Taken together, the core value of insurance lies in risk transfer and expense smoothing, especially in pure-protection products. Market complexity, sales incentives, and policy detail are the major challenges. Consumers should assess their own exposure, financial capacity, and product structure rather than decide solely on sales information. Rational choice gives priority to actual protection needs and avoids treating insurance as the primary tool for investment or saving. By understanding actuarial foundations, functional positioning, and potential shortcomings, a person can use this financial instrument to manage risk with greater control."]}
        ], closing:"Insurance is neither a universal remedy nor a needless burden. Its usefulness depends on whether its protection is precisely matched to the risks a person actually carries."
      }
    };

    let language = "zh";
    const $ = (id) => document.getElementById(id);
    const article = $("article"), chapterList = $("chapter-list"), chapterSelect = $("chapter-select");
    function navTo(id) { document.getElementById(id)?.scrollIntoView({ behavior:"smooth", block:"start" }); }
    function sectionMarkup(section) {
      const art = section.art ? `<div class="concept ${section.art === "terms" ? "terms" : ""}" aria-hidden="true"></div>` : "";
      const strip = section.strip ? `<aside class="strip"><span>${section.strip[0]}</span><p>${section.strip[1]}</p></aside>` : "";
      return `<section class="article-section" id="${section.id}" data-section><header class="section-head"><p class="number">${section.num}</p><div><p class="section-eyebrow">${section.eyebrow}</p><h2>${section.title}</h2></div></header>${art}<div class="prose">${section.p.map((p)=>`<p>${p}</p>`).join("")}</div>${strip}</section>`;
    }
    function render(keepPosition = false) {
      const d = report[language]; document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
      $("report-label").textContent=d.label; $("report-title").textContent=d.title; $("report-subtitle").textContent=d.subtitle; $("report-intro").textContent=d.intro; $("byline").textContent=d.byline; $("read-time").textContent=d.read; $("contents-label").textContent=d.contents; $("note-title").textContent=d.noteTitle; $("note-text").textContent=d.noteText; $("language-text").textContent=d.language; $("language-short").textContent=d.languageShort; $("back-top").setAttribute("aria-label",d.backTop);
      article.innerHTML=d.sections.map(sectionMarkup).join("")+`<footer class="closing"><p class="closing-label">${d.conclusion}</p><blockquote>${d.closing}</blockquote><div class="closing-rule"></div><p class="footer-note">${d.footer}</p></footer>`;
      chapterList.innerHTML=d.sections.map(s=>`<li><button type="button" data-target="${s.id}"><span>${s.num}</span><span>${s.nav}</span></button></li>`).join("");
      chapterSelect.innerHTML=d.sections.map(s=>`<option value="${s.id}">${s.num} · ${s.nav}</option>`).join("");
      document.title=d.title; chapterList.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>navTo(b.dataset.target))); chapterSelect.addEventListener("change",(e)=>navTo(e.target.value)); observeSections(); if (!keepPosition) window.scrollTo(0,0);
    }
    let observer;
    function observeSections() { observer?.disconnect(); observer=new IntersectionObserver((entries)=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;document.querySelectorAll(".chapters li").forEach((li,i)=>li.classList.toggle("active",report[language].sections[i].id===visible.target.id));chapterSelect.value=visible.target.id;},{rootMargin:"-24% 0px -58% 0px",threshold:[.1,.25,.5]}); document.querySelectorAll("[data-section]").forEach(s=>observer.observe(s)); }
    $("language-toggle").addEventListener("click",()=>{const y=window.scrollY;language=language==="zh"?"en":"zh";render(true);window.scrollTo(0,y)});
    $("back-top").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
    window.addEventListener("scroll",()=>{$("back-top").classList.toggle("visible",window.scrollY>520)},{passive:true});
    render();
  </script>
